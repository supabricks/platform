name: performance-accounting
on:
  pull_request:
    paths:
      - 'e2e/native/**'
      - 'install/native/**'
      - 'docs/architecture/sync-performance-evidence/**'
      - '.github/workflows/performance-accounting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependencies
        run: python -m pip install -r e2e/native/requirements.txt psutil==7.2.2
      - name: Validate attribution, profiles, paired comparisons and export
        run: python -m unittest discover -s e2e/native/performance -p 'test_*.py' -v
