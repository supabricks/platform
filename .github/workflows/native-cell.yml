name: native-cell
on:
  pull_request:
    paths:
      - 'crates/core/**'
      - 'crates/local/**'
      - 'Cargo.lock'
      - 'components/**'
      - 'python/analytics/**'
      - 'e2e/native/**'
      - 'examples/orders/**'
      - 'agents/**'
      - '.github/workflows/native-cell.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-cell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            fault_flags: --disk-full
          - runner: macos-15
            target: macos-arm64
            fault_flags: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix e2e/native/drivers --no-audit --no-fund
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Download qualified E01 engineering archive
        uses: actions/download-artifact@v4
        with:
          repository: supabricks/neon
          run-id: 33985043318
          name: native-engine-${{ matrix.target }}
          path: engine-archive
          github-token: ${{ github.token }}
      - name: Verify engine and prepare SQLite-enabled SeaweedFS
        run: |
          python -m pip install -r components/requirements.txt -r e2e/native/requirements.txt
          python components/prepare-native-cell.py ${{ matrix.target }} build/native --engine-archive engine-archive/supabricks-engine-${{ matrix.target }}.tar.gz
      - run: cargo build --locked -p supabricks-local
      - name: Native cell lifecycle, S3 and cold restore
        run: python e2e/native/cell.py --binary target/debug/supabricks --bundle build/native/supabricks-engine-${{ matrix.target }} --helpers build/native --report native-cell.json ${{ matrix.fault_flags }}
      - name: Branches, credentials, TTL and interrupted cleanup
        run: python e2e/native/branches.py --binary target/debug/supabricks --bundle build/native/supabricks-engine-${{ matrix.target }} --helpers build/native --report native-branches.json
      - name: Stable connections, real drivers and wake/suspend races
        run: python e2e/native/connections.py --binary target/debug/supabricks --bundle build/native/supabricks-engine-${{ matrix.target }} --helpers build/native --report native-connections.json
      - name: Public CLI, MCP and orders application workflow
        run: python e2e/native/workflow.py --binary target/debug/supabricks --bundle build/native/supabricks-engine-${{ matrix.target }} --helpers build/native --report native-workflow.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: false
      - name: Install locked exporter environment
        run: uv sync --project python/analytics --locked --managed-python
      - name: Frozen export correctness, isolation and interrupted cleanup
        run: python e2e/native/exports.py --binary target/debug/supabricks --bundle build/native/supabricks-engine-${{ matrix.target }} --helpers build/native --python "$PWD/python/analytics/.venv/bin/python" --worker python/analytics/export.py --report native-exports.json
      - name: Coding-agent setup adapter contracts
        run: python agents/test-setup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cell-${{ matrix.target }}
          path: |
            native-cell.json
            native-cell.log
            native-branches.json
            native-branches.log
            native-connections.json
            native-connections.log
            native-workflow.json
            native-workflow.log
            native-exports.json
            native-exports.log
            build/native/helper-build.json
