name: native-baseline
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r components/requirements.txt
      - run: python components/validate.py
      - run: python -m unittest discover -s components -p 'test_*.py' -v

  analytical-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: spikes/local-analytics/requirements.txt
      - run: python -m pip install -r spikes/local-analytics/requirements.txt
      - name: Synthetic Sail and Delta interoperability
        run: python spikes/local-analytics/smoke.py > analytical-probe-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytical-probe-linux-x86_64
          path: analytical-probe-result.json
