name: native-baseline
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-deltalake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read reviewed Delta source
        id: delta
        run: |
          python3 - <<'PYCODE'
          import json, os
          pin = json.load(open('components/deltalake-source.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + pin['commit'] + '\n')
              output.write('rust=' + pin['rust'] + '\n')
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: delta-io/delta-rs
          ref: ${{ steps.delta.outputs.commit }}
          path: build/deltalake-source
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.delta.outputs.rust }}
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/deltalake-source -> target
          shared-key: source-deltalake-${{ matrix.target }}
          cache-on-failure: true
      - name: Install pinned source builder
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r components/deltalake-build-requirements.txt
      - name: Build native Delta from locked source
        run: python components/build-deltalake.py --source build/deltalake-source --target ${{ matrix.target }} --output build/deltalake-artifacts/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: source-deltalake-${{ matrix.target }}
          path: build/deltalake-artifacts/${{ matrix.target }}
          if-no-files-found: error

  components:
    runs-on: ubuntu-latest
    # Checkout includes qualification evidence and can exceed five minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r components/requirements.txt
      - run: python components/validate.py
      - run: python -m unittest discover -s components -p 'test_*.py' -v

  analytical-native:
    needs: source-deltalake
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: false
      - name: Install exact Python and locked analytical environment
        run: uv sync --project python/analytics --locked --managed-python
      - name: Check hashed export stays in sync with the universal lock
        run: |
          uv export --project python/analytics --locked --format requirements-txt --no-emit-project --output-file python/analytics/requirements.lock > /dev/null
          git diff --exit-code -- python/analytics/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: source-deltalake-${{ matrix.target }}
          path: build/deltalake-artifacts/${{ matrix.target }}
      - name: Verify and install reviewed Delta runtime
        run: |
          python - <<'PYCODE'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'install/native')
          from delta_runtime import verify
          wheel, _ = verify(Path('build/deltalake-artifacts/${{ matrix.target }}'), '${{ matrix.target }}')
          subprocess.run(['uv', 'pip', 'install', '--python', 'python/analytics/.venv/bin/python',
                          '--no-deps', '--reinstall', str(wheel)], check=True)
          PYCODE
      - name: Exporter failure boundaries
        run: |
          set -o pipefail
          python/analytics/.venv/bin/python python/analytics/run_tests.py --report analytical-tests.json 2>&1 | tee analytical-tests.log
      - name: CSV parser and conversion boundaries
        run: python/analytics/.venv/bin/python -m unittest discover -s python/ingest -p 'test_*.py' -v
      - name: Synthetic Sail and Delta qualification
        run: |
          set -o pipefail
          python/analytics/.venv/bin/python python/analytics/qualify.py --output analytical-qualification.json 2>&1 | tee analytical-qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytical-probe-${{ matrix.target }}
          path: |
            analytical-tests.json
            analytical-tests.log
            analytical-qualification.json
            analytical-qualification.log

  # Keep the branch-protection context stable; both native targets must pass.
  analytical-probe:
    if: always()
    needs: analytical-native
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both native analytical fixtures
        env:
          NATIVE_RESULT: ${{ needs.analytical-native.result }}
        run: test "$NATIVE_RESULT" = success
