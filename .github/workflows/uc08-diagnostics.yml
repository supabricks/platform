name: UC08 targeted diagnostics
on:
  push:
    branches: [qualify/uc08-diagnostics]
permissions:
  contents: read
concurrency:
  group: uc08-mapped-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mapped-loopback:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify explicit mapped-loopback policy without permitting external TCP
        run: python e2e/native/notebook-environments/mapped_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapped-loopback
          path: build/mapped.json
