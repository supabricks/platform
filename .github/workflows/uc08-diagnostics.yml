name: UC08 targeted diagnostics
on:
  push:
    branches: [qualify/uc08-diagnostics]
permissions:
  contents: read
  actions: read
concurrency:
  group: uc08-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
            policy: strict
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          repository: supabricks/platform
          run-id: 34486403948
          name: release-${{ matrix.target }}
          path: build/ne01-inputs
          github-token: ${{ github.token }}
      - name: Verify baseline, assemble and relocate the isolated probe
        run: |
          python e2e/native/notebook-environments/prepare.py --directory build/ne01-inputs --output build/ne01-package --target ${{ matrix.target }}
      - name: Offline Linux qualification without host Python, uv or cache
        if: runner.os == 'Linux'
        run: |
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env \
              SB_NE01_NETWORK_EVIDENCE="Ubuntu 24.04 unprivileged user; isolated loopback-only network namespace" \
              "build/ne01-package/relocated probe/service/python/runtime/bin/python3.12" -I -B \
              e2e/native/notebook-environments/run.py --probe "build/ne01-package/relocated probe" \
              --target linux-x86_64 --report build/ne01-reports/qualification.json
          ' bash "$(id -un)"
      - name: Offline macOS qualification without host Python, uv or cache
        if: runner.os == 'macOS'
        run: |
          policy=install/native/offline-macos.sb
          if test "${{ matrix.policy }}" = historical-control; then
            printf '(version 1) (allow default)\n' > /tmp/uc08-diagnostic-policy.sb
            policy=/tmp/uc08-diagnostic-policy.sb
          fi
          sandbox-exec -f "$policy" \
            /usr/bin/env SB_NE01_NETWORK_EVIDENCE="Diagnostic only: ${{ matrix.policy }}; not release qualification" \
            "build/ne01-package/relocated probe/service/python/runtime/bin/python3.12" -I -B \
            e2e/native/notebook-environments/run.py --probe "build/ne01-package/relocated probe" \
            --target macos-arm64 --report build/ne01-reports/qualification.json
      - name: Bounded sandbox denial diagnostics
        if: always()
        run: |
          sudo /usr/bin/log show --last 15m --style json --predicate 'process == "sandboxd"' > /tmp/uc08-sandbox-private.json
          python - <<'PYCODE'
          import json,re
          from pathlib import Path
          rows=json.loads(Path('/tmp/uc08-sandbox-private.json').read_text())
          counts={}
          for row in rows:
              message=row.get('eventMessage','')
              match=re.search(r'deny\(\d+\) ([a-z-]+)',message)
              if match:
                  op=match[1] if match[1] in {'network-outbound','network-inbound','network-bind','file-read-data','file-read-metadata','process-exec'} else 'other'
                  counts[op]=counts.get(op,0)+1
          p=Path('build/ne01-reports/sandbox.json');p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(dict(events=len(rows),denials=counts)))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-environments-${{ matrix.target }}-${{ matrix.policy }}
          path: |
            build/ne01-reports/*.json
            build/ne01-package/relocated probe/probe.json
            build/ne01-package/relocated probe/*.lock
            build/ne01-package/relocated probe/protected.txt
            build/ne01-package/relocated probe/licenses/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-kernel-payload-${{ matrix.target }}-${{ matrix.policy }}
          path: build/ne01-package/kernel-payload-*
          if-no-files-found: error
