name: native-release
on:
  pull_request:
    paths:
      - 'crates/core/**'
      - 'crates/local/**'
      - 'schemas/**'
      - 'examples/projects/**'
      - 'Cargo.lock'
      - 'components/**'
      - 'install/native/**'
      - 'python/analytics/**'
      - 'python/ingest/**'
      - 'python/notebooks/**'
      - 'e2e/native/notebooks/**'
      - 'e2e/native/notebook-environments/**'
      - 'docs/handbook/**'
      - 'console/**'
      - 'console'
      - '.gitmodules'
      - 'examples/orders/**'
      - 'examples/console/**'
      - 'examples/notebooks/**'
      - 'agents/**'
      - 'LICENSE'
      - '.github/workflows/native-release.yml'
  workflow_dispatch:

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  source-catalog:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read reviewed UC source
        id: uc
        run: |
          python - <<'PY'
          import json,os
          pin=json.load(open('components/unity-catalog-source.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+pin['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: supabricks/unitycatalog
          ref: ${{ steps.uc.outputs.commit }}
          path: build/uc-source
      - name: Build locked server, JRE and dependency/license inventory
        run: |
          python components/test_unity_catalog.py
          python install/native/test_unity_catalog.py
          python components/build-unity-catalog.py --source build/uc-source --tools build/uc-tools --output build/uc-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: source-catalog-${{ matrix.target }}
          path: |
            build/uc-runtime.tar.gz
            build/uc-runtime.artifact.json
          if-no-files-found: error

  source-sail:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read reviewed Sail source
        id: sail
        run: |
          python3 - <<'PYCODE'
          import json, os
          pin = json.load(open('components/sail-source.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + pin['commit'] + '\n')
              output.write('rust=' + pin['rust'] + '\n')
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: supabricks/sail
          ref: ${{ steps.sail.outputs.commit }}
          path: build/sail-source
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.sail.outputs.rust }}
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/sail-source -> target
          shared-key: source-sail-${{ matrix.target }}
          cache-on-failure: true
      - name: Install pinned source builder
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r components/sail-build-requirements.txt
      - name: Build native Sail from locked source
        run: python components/build-sail.py --source build/sail-source --target ${{ matrix.target }} --output build/sail-artifacts/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: source-sail-${{ matrix.target }}
          path: build/sail-artifacts/${{ matrix.target }}
          if-no-files-found: error

  assemble:
    needs: [source-sail, source-catalog]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build locked console assets
        run: |
          npm ci --prefix console --no-audit --no-fund
          npm run build --prefix console
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - uses: actions/download-artifact@v4
        with:
          repository: supabricks/neon
          run-id: 33985043318
          name: native-engine-${{ matrix.target }}
          path: build/engine-archive
          github-token: ${{ github.token }}
      - name: Verify engine and build helpers with updates disabled
        run: |
          python -m pip install -r components/requirements.txt
          python components/prepare-native-cell.py ${{ matrix.target }} build/native --offline-runtime --engine-archive build/engine-archive/supabricks-engine-${{ matrix.target }}.tar.gz
      - run: cargo build --locked --release -p supabricks-local
      - name: Installer signature, corruption, traversal and repeat-install contracts
        run: |
          python install/native/test_installer.py
          python install/native/test_analytics.py
          python install/native/test_sail.py
          python install/native/test_unity_catalog.py
          python install/native/test_environment_evidence.py
          python install/native/test_release_evidence.py
          python install/native/test_project_evidence.py
          python install/native/test_project_portability.py
          python install/native/test_demo.py
          python install/native/test_cleanup.py
      - uses: actions/download-artifact@v4
        with:
          name: source-sail-${{ matrix.target }}
          path: build/sail-artifacts/${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: source-catalog-${{ matrix.target }}
          path: build/catalog-input
      - name: Unpack the source-built catalog closure
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          source=Path('build/catalog-input')
          expected=json.loads((source/'uc-runtime.artifact.json').read_text())
          archive=source/'uc-runtime.tar.gz'
          assert expected['target']==os.environ['TARGET']
          with archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==expected['artifact_sha256']
          with tarfile.open(archive) as tar:tar.extractall(source,filter='data')
          destination=Path('build/uc-artifacts')/os.environ['TARGET'];destination.parent.mkdir(parents=True)
          (source/'uc00-runtime').rename(destination)
          PY
      - name: Assemble exact native release
        run: |
          uv export --project python/notebooks --locked --format requirements-txt --no-emit-project --output-file python/notebooks/requirements.lock > /dev/null
          git diff --exit-code -- python/notebooks/requirements.lock
          python install/native/assemble.py --target ${{ matrix.target }} --binary target/release/supabricks --engine build/native/supabricks-engine-${{ matrix.target }} --helpers build/native --output build/releases
      - name: Reject unqualified notebook package changes
        run: |
          release="build/releases/supabricks-v0.1.0-alpha.32-${{ matrix.target }}"
          "$release/python/analytics/python" python/notebooks/test_environment.py "$release"
          "$release/python/analytics/python" python/ingest/test_worker.py
          "$release/python/analytics/python" python/ingest/test_formats.py
          "$release/python/analytics/python" python/analytics/test_session.py
      - name: Export PK07 native base closure from the exact archive
        run: python install/native/project_portability.py bundle --directory build/releases --target ${{ matrix.target }} --output build/project-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: project-bundle-${{ matrix.target }}
          path: build/project-bundle/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            build/releases/*.tar.gz
            build/releases/*.sha256
          if-no-files-found: error

  clean-linux:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: build/releases
      - name: Free disk for the 1 GB snapshot and its WAL/storage copies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/lib/google-cloud-sdk /usr/local/share/powershell /opt/microsoft
          df -h /
      - run: docker build -f install/native/Dockerfile.qualify -t supabricks-release-test .
      - name: Real installer and app workflow without external networking or build tools
        run: |
          mkdir -p build/reports
          chmod 777 build/releases build/reports
          docker run --rm --network=none --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --ulimit core=0:0 \
            -v "$PWD/build/releases:/releases" -v "$PWD/build/reports:/reports" -v "$PWD/install/native:/harness/install/native:ro" \
            -v "$PWD/e2e/native/notebook-environments:/harness/e2e/native/notebook-environments:ro" \
            supabricks-release-test \
            strace -f -qq -e trace=network -s 256 -o /reports/network.trace \
            python3 /harness/install/native/qualify.py --directory /releases --report /reports/qualification.json --minimal-host \
            --network-evidence 'Ubuntu 24.04 minimal unprivileged container; network=none; all descendants traced'
      - name: No attempted external telemetry or update destinations
        run: python3 install/native/check_network.py build/reports/network.trace --report build/reports/network.json
      - name: Measure full snapshots offline without syscall tracing overhead
        run: |
          docker run --rm --network=none --memory=16g --cpus=4 --ulimit core=0:0 \
            -v "$PWD/build/releases:/releases" -v "$PWD/build/reports:/reports" -v "$PWD/install/native:/harness/install/native:ro" \
            -v "$PWD/e2e/native/notebook-environments:/harness/e2e/native/notebook-environments:ro" \
            supabricks-release-test \
            python3 /harness/install/native/qualify.py --directory /releases --report /reports/benchmarks.json --minimal-host --benchmarks \
            --network-evidence 'Ubuntu 24.04 unprivileged container; network=none; 16 GiB and 4 CPU limits; no syscall tracing during measurements'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-linux-x86_64
          path: build/reports/*.json

  isolated-macos:
    needs: assemble
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application test dependency before network isolation
        run: python -m pip install -r examples/orders/requirements.txt
      - name: Qualify on separate Mac runner with external network and Homebrew denied
        run: |
          mkdir -p build/reports
          ulimit -c 0
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(command -v python)" install/native/qualify.py --directory build/releases \
            --report build/reports/qualification.json --benchmarks \
            --network-evidence 'Separate macOS 15 arm64 runner; Seatbelt denies external networking and Homebrew; not a factory-clean Mac'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-macos-arm64
          path: build/reports/*.json

  release-recovery:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - name: Download the exact qualified catalog-9 predecessor
        uses: actions/download-artifact@v4
        with:
          repository: supabricks/platform
          run-id: 34486403948
          name: release-${{ matrix.target }}
          path: build/previous
          github-token: ${{ github.token }}
      - if: runner.os == 'Linux'
        run: |
          docker build -f install/native/Dockerfile.qualify -t supabricks-recovery-test .
          mkdir -p build/reports
          chmod 777 build/releases build/previous build/reports
          docker run --rm --network=none --ulimit core=0:0 \
            -v "$PWD/build/releases:/releases" -v "$PWD/build/previous:/previous" \
            -v "$PWD/build/reports:/reports" -v "$PWD/install/native:/harness:ro" \
            supabricks-recovery-test \
            python3 /harness/recovery.py --directory /releases --previous-directory /previous \
            --report /reports/recovery.json --network-evidence 'Ubuntu 24.04 minimal unprivileged container; network=none; exact PR34 and NE02 archives'
      - if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'macOS'
        run: |
          mkdir -p build/reports
          ulimit -c 0
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(command -v python)" install/native/recovery.py \
            --directory build/releases --previous-directory build/previous \
            --report build/reports/recovery.json \
            --network-evidence 'Separate macOS 15 arm64 runner; external networking and Homebrew denied; exact PR34 and NE02 archives'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-recovery-${{ matrix.target }}
          path: build/reports/*.json

  release-console:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/console-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked browser test machinery before network isolation
        run: |
          npm ci --prefix console --no-audit --no-fund
          npm exec --prefix console -- playwright install --with-deps chromium
          mkdir -p build/console-reports
      - name: Installed browser workflow in an isolated Linux network namespace
        if: runner.os == 'Linux'
        run: |
          node_path=$(command -v node)
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              PLAYWRIGHT_BROWSERS_PATH="$2" \
              SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="Ubuntu 24.04 unprivileged user; isolated network namespace with loopback only" \
              "$3" install/native/qualify_console.py --directory build/releases \
              --report build/console-reports/console.json --node "$4" \
              --harness console/scripts/qualify.mjs
          ' bash "$(id -un)" "$PLAYWRIGHT_BROWSERS_PATH" "$python_path" "$node_path"
      - name: Installed browser workflow on macOS with external network denied
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="macOS 15 arm64; Seatbelt denies external networking and Homebrew" \
            "$(command -v python)" install/native/qualify_console.py --directory build/releases \
            --report build/console-reports/console.json --node "$(command -v node)" \
            --harness console/scripts/qualify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-console-${{ matrix.target }}
          path: build/console-reports/*

  release-ingest:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p build/ingest-reports
      - name: Installed ingestion workflow in an isolated Linux network namespace
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net --mount /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            mount --make-rprivate /
            pressure_mount=$(mktemp -d /tmp/sb-i01-volume.XXXXXX)
            mount -t tmpfs -o size=80m,mode=1777 tmpfs "$pressure_mount"
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SUPABRICKS_INGEST_PRESSURE_DIR="$pressure_mount" \
              SUPABRICKS_INGEST_NETWORK_EVIDENCE="Ubuntu 24.04 unprivileged user; isolated network namespace with loopback only" \
              "$2" install/native/qualify_ingest.py --directory build/releases \
              --report build/ingest-reports/ingest.json \
              --harness python/ingest/qualify.py
          ' bash "$(id -un)" "$python_path"
      - name: Installed ingestion workflow on macOS with external network denied
        if: runner.os == 'macOS'
        run: |
          pressure_mount=$(mktemp -d /tmp/sb-i01-volume.XXXXXX)
          hdiutil create -size 100m -fs HFS+ -volname SupabricksPressure build/ingest-pressure.dmg
          hdiutil attach build/ingest-pressure.dmg -mountpoint "$pressure_mount" -nobrowse
          trap 'qualification_status=$?; trap - EXIT; if ! bash install/native/detach_macos_volume.sh "$pressure_mount"; then qualification_status=1; fi; exit "$qualification_status"' EXIT
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_INGEST_PRESSURE_DIR="$pressure_mount" \
            SUPABRICKS_INGEST_NETWORK_EVIDENCE="macOS 15 arm64; Seatbelt denies external networking and Homebrew" \
            "$(command -v python)" install/native/qualify_ingest.py --directory build/releases \
            --report build/ingest-reports/ingest.json \
            --harness python/ingest/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ingest-${{ matrix.target }}
          path: build/ingest-reports/*

  release-environments:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SB_NE02_NETWORK_EVIDENCE="Ubuntu 24.04; unprivileged loopback-only namespace" \
              "$2" install/native/qualify_environments.py --directory build/releases \
              --target linux-x86_64 --report build/environment-reports/qualification.json
          ' bash "$(id -un)" "$python_path"
      - if: runner.os == 'macOS'
        run: |
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SB_NE02_NETWORK_EVIDENCE="macOS 15 arm64; external networking and Homebrew denied" \
            "$(command -v python)" install/native/qualify_environments.py --directory build/releases \
            --target macos-arm64 --report build/environment-reports/qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-environments-${{ matrix.target }}
          path: build/environment-reports/*.json
          if-no-files-found: error

  release-notebooks:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/notebook-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked browser test machinery before network isolation
        run: |
          npm ci --prefix e2e/native/notebooks/frontend --no-audit --no-fund
          npm ci --prefix console --no-audit --no-fund
          npm exec --prefix e2e/native/notebooks/frontend -- playwright install --with-deps chromium
          mkdir -p build/notebook-reports
      - name: Installed browser workflow in an isolated Linux network namespace
        if: runner.os == 'Linux'
        run: |
          node_path=$(command -v node)
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              PLAYWRIGHT_BROWSERS_PATH="$2" \
              SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="Ubuntu 24.04 unprivileged user; isolated network namespace with loopback only" \
              "$3" install/native/qualify_console.py --directory build/releases \
              --report build/notebook-reports/notebooks.json --node "$4" \
              --harness e2e/native/notebooks/qualify-product.mjs
          ' bash "$(id -un)" "$PLAYWRIGHT_BROWSERS_PATH" "$python_path" "$node_path"
      - name: Installed browser workflow on macOS with external network denied
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="macOS 15 arm64; Seatbelt denies external networking and Homebrew" \
            "$(command -v python)" install/native/qualify_console.py --directory build/releases \
            --report build/notebook-reports/notebooks.json --node "$(command -v node)" \
            --harness e2e/native/notebooks/qualify-product.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-notebooks-${{ matrix.target }}
          path: build/notebook-reports/*

  release-packages:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact-release registry packages and cold offline bundle reconstruction
        run: python install/native/qualify_environments.py --packages --directory build/releases --target ${{ matrix.target }} --report build/package-reports/qualification.json --bundle-fixture build/package-fixture/environment.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-packages-${{ matrix.target }}
          path: build/package-reports/*.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: environment-bundle-${{ matrix.target }}
          path: build/package-fixture/environment.zip
          if-no-files-found: error

  release-environment-console:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser qualification
        run: |
          npm ci --prefix console --no-audit --no-fund
          npm exec --prefix console -- playwright install --with-deps chromium
          mkdir -p build/environment-console-reports
      - name: Qualify real console package controls against the installed archive
        run: >-
          python install/native/qualify_console.py --directory build/releases
          --report build/environment-console-reports/environments.json
          --node "$(command -v node)" --harness console/scripts/qualify-environments.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-environment-console-${{ matrix.target }}
          path: build/environment-console-reports/*
          if-no-files-found: error

  release-environment-lifecycle:
    needs: [assemble, release-packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: environment-bundle-${{ matrix.target }}
          path: build/package-fixture
      - name: Download the exact qualified NE05 predecessor
        uses: actions/download-artifact@v4
        with:
          repository: supabricks/platform
          run-id: 34733919344
          name: release-${{ matrix.target }}
          path: build/previous
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade, cold restore and controlled resolver on loopback-only Linux
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SB_NE02_NETWORK_EVIDENCE="Ubuntu 24.04; unprivileged loopback-only namespace; cold private HOME and caches" \
              "$2" install/native/qualify_environments.py --lifecycle --directory build/releases \
              --previous-directory build/previous --bundle-fixture build/package-fixture/environment.zip \
              --target linux-x86_64 --report build/environment-lifecycle-reports/qualification.json
          ' bash "$(id -un)" "$python_path"
      - name: Upgrade, cold restore and controlled resolver on isolated macOS
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SB_NE02_NETWORK_EVIDENCE="macOS 15 arm64; external networking and Homebrew denied; cold private HOME and caches" \
            "$(command -v python)" install/native/qualify_environments.py --lifecycle --directory build/releases \
            --previous-directory build/previous --bundle-fixture build/package-fixture/environment.zip \
            --target macos-arm64 --report build/environment-lifecycle-reports/qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-environment-lifecycle-${{ matrix.target }}
          path: build/environment-lifecycle-reports/*.json
          if-no-files-found: error

  project-source:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          pattern: project-bundle-*
          path: build/bundles
      - name: Produce one deterministic project containing both native closures
        run: python3 install/native/project_portability.py produce --directory build/releases --target linux-x86_64 --bundles build/bundles --output build/project
      - uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: build/project/*
          if-no-files-found: error

  release-projects:
    needs: [assemble, project-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/download-artifact@v4
        with:
          name: project-source
          path: build/project
      - uses: actions/download-artifact@v4
        with:
          repository: supabricks/platform
          run-id: 35460901104
          name: release-${{ matrix.target }}
          path: build/previous
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shared project through clean install, upgrade and restore on isolated Linux
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net --mount /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            mount --make-rprivate /
            pressure_mount=$(mktemp -d /tmp/sb-pk07-volume.XXXXXX)
            mount -t tmpfs -o size=80m,mode=1777 tmpfs "$pressure_mount"
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SUPABRICKS_PROJECT_PRESSURE_DIR="$pressure_mount" \
              SUPABRICKS_PROJECT_NETWORK_EVIDENCE="Ubuntu 24.04; unprivileged loopback-only namespace; private HOME and caches" \
              "$2" install/native/project_portability.py consume --directory build/releases \
              --previous-directory build/previous --package build/project --target linux-x86_64 \
              --report build/project-reports/projects.json
          ' bash "$(id -un)" "$python_path"
      - name: Shared project on macOS with external network and Homebrew denied
        if: runner.os == 'macOS'
        run: |
          pressure_mount=$(mktemp -d /tmp/sb-pk07-volume.XXXXXX)
          hdiutil create -size 100m -fs HFS+ -volname SupabricksProjects build/project-pressure.dmg
          hdiutil attach build/project-pressure.dmg -mountpoint "$pressure_mount" -nobrowse
          trap 'qualification_status=$?; trap - EXIT; if ! bash install/native/detach_macos_volume.sh "$pressure_mount"; then qualification_status=1; fi; exit "$qualification_status"' EXIT
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_PROJECT_PRESSURE_DIR="$pressure_mount" \
            SUPABRICKS_PROJECT_NETWORK_EVIDENCE="macOS 15 arm64; external networking and Homebrew denied; private HOME and caches" \
            "$(command -v python)" install/native/project_portability.py consume --directory build/releases \
            --previous-directory build/previous --package build/project --target macos-arm64 \
            --report build/project-reports/projects.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-projects-${{ matrix.target }}
          path: build/project-reports/*.json
          if-no-files-found: error

  environment-evidence:
    needs: [release-projects, clean-linux, isolated-macos, release-recovery, release-console, release-ingest, release-environments, release-notebooks, release-packages, release-environment-console, release-environment-lifecycle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-environment*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-packages-*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-notebooks-*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-console-*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-ingest-*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-recovery-*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-qualification-*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          name: project-source
          path: build/evidence/project-source
      - uses: actions/download-artifact@v4
        with:
          pattern: release-projects-*
          path: build/evidence
      - name: Require complete local workflow evidence for both exact releases
        run: |
          python3 install/native/environment_evidence.py --directory build/evidence --revision "${{ github.sha }}" --report build/ne06-evidence.json
          python3 install/native/release_evidence.py --directory build/evidence --revision "${{ github.sha }}" \
            --console "$(git rev-parse HEAD:console)" --worker python/ingest/worker.py --report build/r04-evidence.json
          cat build/r04-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ne06-evidence
          path: build/ne06-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: r04-evidence
          path: build/r04-evidence.*
          if-no-files-found: error
