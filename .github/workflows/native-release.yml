name: native-release
on:
  pull_request:
    paths:
      - 'crates/core/**'
      - 'crates/local/**'
      - 'Cargo.lock'
      - 'components/**'
      - 'install/native/**'
      - 'python/analytics/**'
      - 'python/ingest/**'
      - 'console/**'
      - 'examples/orders/**'
      - 'agents/**'
      - 'LICENSE'
      - '.github/workflows/native-release.yml'
  workflow_dispatch:

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build locked console assets
        run: |
          npm ci --prefix console --no-audit --no-fund
          npm run build --prefix console
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - uses: actions/download-artifact@v4
        with:
          repository: supabricks/neon
          run-id: 33985043318
          name: native-engine-${{ matrix.target }}
          path: build/engine-archive
          github-token: ${{ github.token }}
      - name: Verify engine and build helpers with updates disabled
        run: |
          python -m pip install -r components/requirements.txt
          python components/prepare-native-cell.py ${{ matrix.target }} build/native --offline-runtime --engine-archive build/engine-archive/supabricks-engine-${{ matrix.target }}.tar.gz
      - run: cargo build --locked --release -p supabricks-local
      - name: Installer signature, corruption, traversal and repeat-install contracts
        run: |
          python install/native/test_installer.py
          python install/native/test_analytics.py
      - name: Assemble exact native release
        run: |
          python install/native/assemble.py --target ${{ matrix.target }} --binary target/release/supabricks --engine build/native/supabricks-engine-${{ matrix.target }} --helpers build/native --output build/releases
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            build/releases/*.tar.gz
            build/releases/*.sha256
          if-no-files-found: error

  clean-linux:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: build/releases
      - name: Free disk for the 1 GB snapshot and its WAL/storage copies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/lib/google-cloud-sdk /usr/local/share/powershell /opt/microsoft
          df -h /
      - run: docker build -f install/native/Dockerfile.qualify -t supabricks-release-test .
      - name: Real installer and app workflow without external networking or build tools
        run: |
          mkdir -p build/reports
          chmod 777 build/releases build/reports
          docker run --rm --network=none --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --ulimit core=0:0 \
            -v "$PWD/build/releases:/releases" -v "$PWD/build/reports:/reports" -v "$PWD/install/native:/harness:ro" \
            supabricks-release-test \
            strace -f -qq -e trace=network -s 256 -o /reports/network.trace \
            python3 /harness/qualify.py --directory /releases --report /reports/qualification.json --minimal-host \
            --network-evidence 'Ubuntu 24.04 minimal unprivileged container; network=none; all descendants traced'
      - name: No attempted external telemetry or update destinations
        run: python3 install/native/check_network.py build/reports/network.trace --report build/reports/network.json
      - name: Measure full snapshots offline without syscall tracing overhead
        run: |
          docker run --rm --network=none --memory=16g --cpus=4 --ulimit core=0:0 \
            -v "$PWD/build/releases:/releases" -v "$PWD/build/reports:/reports" -v "$PWD/install/native:/harness:ro" \
            supabricks-release-test \
            python3 /harness/qualify.py --directory /releases --report /reports/benchmarks.json --minimal-host --benchmarks \
            --network-evidence 'Ubuntu 24.04 unprivileged container; network=none; 16 GiB and 4 CPU limits; no syscall tracing during measurements'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-linux-x86_64
          path: build/reports/*.json

  isolated-macos:
    needs: assemble
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application test dependency before network isolation
        run: python -m pip install -r examples/orders/requirements.txt
      - name: Qualify on separate Mac runner with external network and Homebrew denied
        run: |
          mkdir -p build/reports
          ulimit -c 0
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(command -v python)" install/native/qualify.py --directory build/releases \
            --report build/reports/qualification.json --benchmarks \
            --network-evidence 'Separate macOS 15 arm64 runner; Seatbelt denies external networking and Homebrew; not a factory-clean Mac'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-macos-arm64
          path: build/reports/*.json

  release-recovery:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - name: Download the exact qualified R03 predecessor
        uses: actions/download-artifact@v4
        with:
          repository: supabricks/platform
          run-id: 34184744702
          name: release-${{ matrix.target }}
          path: build/previous
          github-token: ${{ github.token }}
      - if: runner.os == 'Linux'
        run: |
          docker build -f install/native/Dockerfile.qualify -t supabricks-recovery-test .
          mkdir -p build/reports
          chmod 777 build/releases build/previous build/reports
          docker run --rm --network=none --ulimit core=0:0 \
            -v "$PWD/build/releases:/releases" -v "$PWD/build/previous:/previous" \
            -v "$PWD/build/reports:/reports" -v "$PWD/install/native:/harness:ro" \
            supabricks-recovery-test \
            python3 /harness/recovery.py --directory /releases --previous-directory /previous \
            --report /reports/recovery.json --network-evidence 'Ubuntu 24.04 minimal unprivileged container; network=none; exact R03 and I00 archives'
      - if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'macOS'
        run: |
          mkdir -p build/reports
          ulimit -c 0
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(command -v python)" install/native/recovery.py \
            --directory build/releases --previous-directory build/previous \
            --report build/reports/recovery.json \
            --network-evidence 'Separate macOS 15 arm64 runner; external networking and Homebrew denied; exact R03 and I00 archives'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-recovery-${{ matrix.target }}
          path: build/reports/*.json

  release-console:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/console-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked browser test machinery before network isolation
        run: |
          npm ci --prefix console --no-audit --no-fund
          npm exec --prefix console -- playwright install --with-deps chromium
          mkdir -p build/console-reports
      - name: Installed browser workflow in an isolated Linux network namespace
        if: runner.os == 'Linux'
        run: |
          node_path=$(command -v node)
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              PLAYWRIGHT_BROWSERS_PATH="$2" \
              SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="Ubuntu 24.04 unprivileged user; isolated network namespace with loopback only" \
              "$3" install/native/qualify_console.py --directory build/releases \
              --report build/console-reports/console.json --node "$4" \
              --harness console/scripts/qualify.mjs
          ' bash "$(id -un)" "$PLAYWRIGHT_BROWSERS_PATH" "$python_path" "$node_path"
      - name: Installed browser workflow on macOS with external network denied
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="macOS 15 arm64; Seatbelt denies external networking and Homebrew" \
            "$(command -v python)" install/native/qualify_console.py --directory build/releases \
            --report build/console-reports/console.json --node "$(command -v node)" \
            --harness console/scripts/qualify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-console-${{ matrix.target }}
          path: build/console-reports/*

  release-ingest:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p build/ingest-reports
      - name: Installed ingestion workflow in an isolated Linux network namespace
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net --mount /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            mount --make-rprivate /
            mkdir -p build/ingest-pressure
            mount -t tmpfs -o size=80m,mode=1777 tmpfs build/ingest-pressure
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SUPABRICKS_INGEST_PRESSURE_DIR="$PWD/build/ingest-pressure" \
              SUPABRICKS_INGEST_NETWORK_EVIDENCE="Ubuntu 24.04 unprivileged user; isolated network namespace with loopback only" \
              "$2" install/native/qualify_ingest.py --directory build/releases \
              --report build/ingest-reports/ingest.json \
              --harness python/ingest/qualify.py
          ' bash "$(id -un)" "$python_path"
      - name: Installed ingestion workflow on macOS with external network denied
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/ingest-pressure
          hdiutil create -size 100m -fs HFS+ -volname SupabricksPressure build/ingest-pressure.dmg
          hdiutil attach build/ingest-pressure.dmg -mountpoint "$PWD/build/ingest-pressure" -nobrowse
          trap 'hdiutil detach "$PWD/build/ingest-pressure"' EXIT
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_INGEST_PRESSURE_DIR="$PWD/build/ingest-pressure" \
            SUPABRICKS_INGEST_NETWORK_EVIDENCE="macOS 15 arm64; Seatbelt denies external networking and Homebrew" \
            "$(command -v python)" install/native/qualify_ingest.py --directory build/releases \
            --report build/ingest-reports/ingest.json \
            --harness python/ingest/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ingest-${{ matrix.target }}
          path: build/ingest-reports/*
