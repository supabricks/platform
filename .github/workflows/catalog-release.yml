name: ingestion-diagnostic
on:
  workflow_dispatch:
    inputs:
      archive_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release-ingest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ github.token }}
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p build/ingest-reports
      - name: Installed ingestion workflow in an isolated Linux network namespace
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net --mount /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            mount --make-rprivate /
            pressure_mount=$(mktemp -d /tmp/sb-i01-volume.XXXXXX)
            mount -t tmpfs -o size=80m,mode=1777 tmpfs "$pressure_mount"
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SUPABRICKS_INGEST_PRESSURE_DIR="$pressure_mount" \
              SUPABRICKS_INGEST_NETWORK_EVIDENCE="Ubuntu 24.04 unprivileged user; isolated network namespace with loopback only" \
              "$2" install/native/qualify_ingest.py --directory build/releases \
              --report build/ingest-reports/ingest.json \
              --harness python/ingest/qualify.py
          ' bash "$(id -un)" "$python_path"
      - name: Installed ingestion workflow on macOS with external network denied
        if: runner.os == 'macOS'
        run: |
          pressure_mount=$(mktemp -d /tmp/sb-i01-volume.XXXXXX)
          hdiutil create -size 100m -fs HFS+ -volname SupabricksPressure build/ingest-pressure.dmg
          hdiutil attach build/ingest-pressure.dmg -mountpoint "$pressure_mount" -nobrowse
          trap 'qualification_status=$?; trap - EXIT; if ! bash install/native/detach_macos_volume.sh "$pressure_mount"; then qualification_status=1; fi; exit "$qualification_status"' EXIT
          sandbox-exec -f install/native/offline-macos.sb \
            /usr/bin/env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_INGEST_PRESSURE_DIR="$pressure_mount" \
            SUPABRICKS_INGEST_NETWORK_EVIDENCE="macOS 15 arm64; Seatbelt denies external networking and Homebrew" \
            "$(command -v python)" install/native/qualify_ingest.py --directory build/releases \
            --report build/ingest-reports/ingest.json \
            --harness python/ingest/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ingest-${{ matrix.target }}
          path: build/ingest-reports/*

