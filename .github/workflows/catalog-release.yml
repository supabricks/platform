name: catalog-release
on:
  workflow_call:
    inputs:
      archive_run_id:
        description: Run containing the unchanged native release archives
        required: true
        type: string
  workflow_dispatch:
    inputs:
      archive_run_id:
        description: Existing archive run to diagnose; this alone does not qualify a release
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ github.token }}
          name: release-${{ matrix.target }}
          path: build/releases
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install qualification tools before isolating the host
        run: |
          python -m pip install -r e2e/native/catalog/requirements.txt
          npm ci --prefix console --no-audit --no-fund
          npm exec --prefix console -- playwright install --with-deps chromium
      - name: Catalog through localhost curl on offline Linux without system Java
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          node_path=$(command -v node)
          sudo unshare --net --mount /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            mount --make-rprivate /
            # Mask the host JDK; the candidate must execute its own JRE.
            if test -d /usr/lib/jvm; then mount -t tmpfs tmpfs /usr/lib/jvm; fi
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              "$2" install/native/qualify_catalog.py --directory build/releases \
              --console console --node "$3" --target linux-x86_64 --disk-full \
              --network-evidence "Linux loopback-only namespace; private JRE; all descendants isolated" \
              --report build/catalog-reports/catalog.json
          ' bash "$(id -un)" "$python_path" "$node_path"
      - name: Catalog through localhost curl on offline macOS without system Java
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f install/native/offline-macos.sb \
            env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$(command -v python)" install/native/qualify_catalog.py --directory build/releases \
            --console console --node "$(command -v node)" --target macos-arm64 \
            --network-evidence "macOS Seatbelt; external network, system Java and Homebrew denied for all descendants" \
            --report build/catalog-reports/catalog.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-catalog-${{ matrix.target }}
          path: build/catalog-reports/*.json
          if-no-files-found: error

