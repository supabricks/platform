name: governed-data-diagnostic
on:
  workflow_dispatch:
    inputs:
      archive_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ github.token }}
          name: release-linux-x86_64
          path: build/diagnostic/archive
      - name: Verify and extract the unchanged archive
        run: |
          cd build/diagnostic/archive
          sha256sum -c supabricks-v0.1.0-alpha.36-linux-x86_64.tar.gz.sha256
          tar -xzf supabricks-v0.1.0-alpha.36-linux-x86_64.tar.gz
          supabricks/bin/supabricks installation verify
      - name: Prepare the same offline qualification image
        run: docker build -f install/native/Dockerfile.governed -t supabricks-ci-data .
      - name: Qualify data with the CI resource limits
        run: |
          mkdir -p build/diagnostic/reports
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --memory 16g --memory-swap 16g --cpus 4 --pids-limit 4096 \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/build/diagnostic/reports,target=/work/build/diagnostic/reports" \
            --workdir /work --env HOME=/tmp supabricks-ci-data \
            python3 install/native/catalog_gate.py --timeout 900 \
            --report build/diagnostic/reports/cleanup.json -- \
            python3 e2e/native/governed/qualify.py --exact-installed \
            --binary build/diagnostic/archive/supabricks/bin/supabricks \
            --release build/diagnostic/archive/supabricks \
            --report build/diagnostic/reports/data.json \
            > build/diagnostic/data.private.log 2>&1
      - name: Export structural diagnostics only
        if: always()
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'install/native')
          from diagnostics import summarize
          root=Path('build/diagnostic/reports');root.mkdir(parents=True,exist_ok=True)
          (root/'diagnostics.json').write_text(json.dumps(summarize('build/diagnostic/data.private.log'),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governed-data-diagnostic
          path: build/diagnostic/reports/*.json
