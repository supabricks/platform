name: catalog-probe
on:
  pull_request:
    paths:
      - 'components/*unity-catalog*'
      - 'components/test_unity_catalog.py'
      - 'crates/local/**'
      - 'schemas/catalog-*.schema.json'
      - 'console'
      - 'console/**'
      - 'python/analytics/**'
      - 'e2e/native/notebook-environments/client.py'
      - 'Cargo.lock'
      - 'install/native/unity_catalog.py'
      - 'install/native/test_unity_catalog.py'
      - 'e2e/native/catalog/**'
      - 'e2e/native/identity/**'
      - 'e2e/native/iam/pins.lock.json'
      - '.github/workflows/catalog-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build console and install browser qualification tools
        run: |
          npm ci --prefix console --no-audit --no-fund
          npm run build --prefix console
          npm exec --prefix console -- playwright install --with-deps chromium
      - name: Frozen worker contracts
        run: python -m unittest discover -s python/analytics -p test_session.py
      - name: Build the platform service owner
        run: cargo build --locked --release -p supabricks-local --bin supabricks
      - name: Read reviewed source and baseline pins
        id: pins
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json,os
          source=json.load(open('components/unity-catalog-source.lock.json'))
          baseline=json.load(open('e2e/native/catalog/baseline.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('commit='+source['commit']+'\n')
              out.write('artifact='+str(baseline['targets'][os.environ['TARGET']]['artifact_id'])+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: supabricks/unitycatalog
          ref: ${{ steps.pins.outputs.commit }}
          path: build/uc-source
      - name: Build the pinned server and private JRE closure
        run: |
          python components/test_unity_catalog.py
          python install/native/test_unity_catalog.py
          python components/build-unity-catalog.py --source build/uc-source --tools build/uc-tools --output build/uc-runtime
      - name: Qualify governed catalog grants against the real pinned UC server
        run: |
          SUPABRICKS_UC093_RUNTIME="$PWD/build/uc-runtime" \
            cargo test --locked -p supabricks-local --lib catalog_governance_real_uc -- --ignored --test-threads=1
      - name: Qualify real OIDC users through the managed catalog broker
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/reports
          python e2e/native/identity/qualify.py --binary target/release/supabricks \
            --uc-runtime build/uc-runtime --output build/reports/uc093-identity.json
      - name: Download and verify the qualified source-built Sail/PG baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/supabricks/platform/actions/artifacts/${{ steps.pins.outputs.artifact }}/zip > build/baseline.zip
          python e2e/native/catalog/prepare.py --target ${{ matrix.target }} --artifact build/baseline.zip --output build/baseline
          rm build/baseline.zip
          python -m pip install -r e2e/native/catalog/requirements.txt
      - name: Probe offline on Linux
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SB_UC00_NETWORK_EVIDENCE="unprivileged loopback-only Linux network namespace" \
              "$2" e2e/native/catalog/probe.py \
              --release build/baseline/supabricks \
              --uc-runtime build/uc-runtime --report build/reports/probe.json
          ' bash "$(id -un)" "$python_path"
      - name: Probe offline on macOS
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f e2e/native/catalog/offline-macos.sb \
            env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SB_UC00_NETWORK_EVIDENCE="macOS sandbox; external outbound connections and Homebrew denied; service listeners checked on loopback" \
            "$(command -v python)" e2e/native/catalog/probe.py \
            --release build/baseline/supabricks \
            --uc-runtime build/uc-runtime --report build/reports/probe.json
      - name: Qualify the installed catalog service offline on Linux
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SB_UC00_NETWORK_EVIDENCE="unprivileged loopback-only Linux network namespace" \
              "$2" e2e/native/catalog/service.py \
              --release build/baseline/supabricks --binary target/release/supabricks \
              --uc-runtime build/uc-runtime --report build/reports/service.json
          ' bash "$(id -un)" "$python_path"
      - name: Qualify the installed catalog service offline on macOS
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f e2e/native/catalog/offline-macos.sb \
            env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SB_UC00_NETWORK_EVIDENCE="macOS sandbox; external outbound connections and Homebrew denied" \
            "$(command -v python)" e2e/native/catalog/service.py \
            --release build/baseline/supabricks --binary target/release/supabricks \
            --uc-runtime build/uc-runtime --report build/reports/service.json
      - name: Qualify catalog browser workflow offline on Linux
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          node_path=$(command -v node)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="unprivileged loopback-only Linux network namespace" \
              "$2" e2e/native/catalog/console.py \
              --release build/baseline/supabricks --binary target/release/supabricks \
              --uc-runtime build/uc-runtime --console console --node "$3" \
              --report build/reports/browser.json
          ' bash "$(id -un)" "$python_path" "$node_path"
      - name: Qualify catalog browser workflow offline on macOS
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f e2e/native/catalog/offline-macos.sb \
            env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SUPABRICKS_CONSOLE_NETWORK_EVIDENCE="macOS sandbox; external outbound connections and Homebrew denied" \
            "$(command -v python)" e2e/native/catalog/console.py \
            --release build/baseline/supabricks --binary target/release/supabricks \
            --uc-runtime build/uc-runtime --console console --node "$(command -v node)" \
            --report build/reports/browser.json
      - name: Reclaim completed fixture release copies
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          # These preceding fixtures have completed and stopped every process.
          # Keep their data/diagnostics; immutable engine copies are reproducible.
          for pattern in ('sb-uc01-*/release', 'sb-uc06-*/release'):
              for release in Path('/tmp').glob(pattern):
                  if release.is_dir() and not release.is_symlink():
                      shutil.rmtree(release)
          PYTHON
      - name: Qualify stopped catalog recovery offline on Linux
        if: runner.os == 'Linux'
        run: |
          python_path=$(command -v python)
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec runuser -u "$1" -- env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              SB_UC00_NETWORK_EVIDENCE="unprivileged loopback-only Linux network namespace" \
              "$2" e2e/native/catalog/recovery.py \
              --release build/baseline/supabricks --binary target/release/supabricks \
              --uc-runtime build/uc-runtime --disk-full --report build/reports/recovery.json
          ' bash "$(id -un)" "$python_path"
      - name: Qualify stopped catalog recovery offline on macOS
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -f e2e/native/catalog/offline-macos.sb \
            env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            SB_UC00_NETWORK_EVIDENCE="macOS sandbox; external outbound connections and Homebrew denied" \
            "$(command -v python)" e2e/native/catalog/recovery.py \
            --release build/baseline/supabricks --binary target/release/supabricks \
            --uc-runtime build/uc-runtime --report build/reports/recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uc00-${{ matrix.target }}
          path: |
            build/reports/*.json
            build/uc-runtime/build.json
            build/uc-runtime.artifact.json
            build/uc-tools/build.log
          if-no-files-found: error
