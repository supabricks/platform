# Platform API (docs/plans/platform-api-implementation.md). Every pull request
# in any workstream runs this: the contract checks need no build, and the
# server tests run the full harness against a real daemon.
name: api
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r api/tests/requirements.txt
      - name: specification is valid
        run: npx --yes @redocly/cli@2.62.1 lint api/openapi.yaml --config api/redocly.yaml
      - name: route table and status table match the specification
        run: python3 api/scripts/generate.py --check
      - name: specification rules (L0)
        run: python3 -m pytest api/tests -m l0 -q
      - name: no incompatible change to a protected operation
        if: github.event_name == 'pull_request'
        run: |
          base="$RUNNER_TEMP/base"; mkdir -p "$base"
          if ! git archive "origin/${{ github.base_ref }}" api 2>/dev/null | tar -x -C "$base" \
             || [ ! -f "$base/api/scripts/bundle.py" ]; then
            echo "the base branch has no specification yet; nothing to compare"; exit 0
          fi
          python3 "$base/api/scripts/bundle.py" --protected > "$RUNNER_TEMP/base.json"
          python3 api/scripts/bundle.py > "$RUNNER_TEMP/head.json"
          docker run --rm -v "$RUNNER_TEMP:/w" \
            tufin/oasdiff@sha256:37cded09a045370fcbebc95640e6269d2e3548a781e13ae0549cc34905c39d9c \
            breaking /w/base.json /w/head.json --fail-on ERR

  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r api/tests/requirements.txt -r api/tests/requirements-worker.txt
      - run: cargo build --locked -p supabricks-local
      - name: API tests against a real server, local and governed (L0 to L7)
        run: python3 -m pytest api/tests -q --binary target/debug/supabricks --require-worker

  # Tests marked `engine`: work that has to finish on real PostgreSQL. The
  # engines are the qualified archive the native-cell workflow uses.
  engines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Download qualified E01 engineering archive
        uses: actions/download-artifact@v4
        with:
          repository: supabricks/neon
          run-id: 33985043318
          name: native-engine-${{ matrix.target }}
          path: engine-archive
          github-token: ${{ github.token }}
      - name: Verify engine and prepare SQLite-enabled SeaweedFS
        run: |
          python -m pip install -r components/requirements.txt
          python components/prepare-native-cell.py ${{ matrix.target }} build/native --engine-archive engine-archive/supabricks-engine-${{ matrix.target }}.tar.gz
      # After the step above: the two files pin different jsonschema versions.
      - run: python -m pip install -r api/tests/requirements.txt -r api/tests/requirements-worker.txt
      - run: cargo build --locked -p supabricks-local
      # The sync workers run only under exactly this environment.
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
          enable-cache: false
      - run: uv sync --project python/analytics --locked --managed-python
      - name: API tests that need database engines
        run: >-
          python -m pytest api/tests -q -m engine --require-engines --require-worker --require-analytics
          --worker-python "$PWD/python/analytics/.venv/bin/python" --binary target/debug/supabricks
          --bundle build/native/supabricks-engine-${{ matrix.target }} --helpers build/native
