# Required contexts stay stable; unrelated jobs skip at job level, never by workflow path filters.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/check-scope.yml

  portable:
    needs: changes
    if: needs.changes.outputs.portable == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # Recovery now exercises each supported catalog migration and crash boundary.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: portable contracts and local crash recovery without UI or cluster setup
        run: cargo test --locked -p supabricks-core -p supabricks-local
      - name: experimental preparation range and receipt contracts
        run: cargo test --locked -p supabricks-local --lib --features sync-lookahead engine::preparation::tests
      - name: console survives a busy daemon and fences changed ownership
        run: |
          cargo build --locked -p supabricks-local
          python3 e2e/native/console_health.py --binary target/debug/supabricks

  unit:
    needs: changes
    # A failed selector must fail a required context, not silently skip every job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require successful scope selection
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@v4
        with:
          submodules: ${{ needs.changes.outputs.console == 'true' }}
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.fmt == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.operator == 'true'
        with:
          workspaces: .
      # Comprehensive local checks remain available explicitly via `just verify-static`.
      # Portable owns core/local tests on both OSes; do not run them twice on Linux.
      - name: rust format
        if: needs.changes.outputs.fmt == 'true'
        run: cargo fmt -- --check

      - name: Portable dependency and upgrade-control contracts (once on Linux)
        if: needs.changes.outputs.portable == 'true'
        run: |
          python3 scripts/check-portable-deps.py
          python3 -m unittest discover -s install/native -p test_upgrade_control.py -v

      - name: Package archive and registry source policy
        if: needs.changes.outputs.notebooks == 'true'
        run: python3 -m unittest discover -s python/notebooks -p test_environment_packages.py

      - name: cargo test (T1 unit + T2 snapshots + chart hardening contract)
        if: needs.changes.outputs.operator == 'true'
        run: cargo test --locked --workspace --exclude supabricks-core --exclude supabricks-local

      - name: generated CRDs match crd.rs
        if: needs.changes.outputs.operator == 'true'
        run: cargo run --locked --bin crdgen | diff -u chart/crds/sspc-crds.yaml -

      - name: helm lint
        if: needs.changes.outputs.operator == 'true'
        run: helm lint chart

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.console == 'true'
        with:
          node-version: '22'
      - name: UI tests + build
        if: needs.changes.outputs.ui == 'true'
        run: cd ui && npm ci --no-audit --no-fund && npm test && npm run build
      - name: Local console typecheck and locked asset build
        if: needs.changes.outputs.console == 'true'
        run: npm ci --prefix console --no-audit --no-fund && npm run build --prefix console

  e2e:
    needs: changes
    if: needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Hosted runners have ~14GB free; at peak the image set exists three
      # times (host docker storage + save-tar + kind-node containerd), so
      # drop all the preinstalled bloat we will never use.
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/lib/google-cloud-sdk /usr/local/share/powershell /opt/microsoft
          df -h /

      # Build the operator image with a layer cache so the cargo release
      # build doesn't cold-start every run. up.sh sees the tag and skips
      # its own build.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: sspc-operator:p1
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is loaded into the docker daemon and the layer cache is
      # exported to GHA — the local builder copy is pure disk pressure now.
      - name: reclaim local build cache
        run: docker builder prune -af && df -h /

      - name: kind cluster (the installer's own config)
        uses: helm/kind-action@v1
        with:
          cluster_name: sspc
          config: install/kind-config.yaml

      - name: install the platform (the real installer, CI mode)
        run: ./install/up.sh --yes

      - name: T3/T4 e2e gate
        run: ./e2e/run.sh

      - name: T6 chaos drills (operator kill, pageserver restart, node reboot)
        run: ./e2e/chaos.sh

      - name: T7 cold-attach restore (destroy local state, rebuild from bucket)
        run: ./e2e/restore.sh

      - name: failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/e2e-artifacts/
          if-no-files-found: ignore
