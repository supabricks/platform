# RFC 014 H5: the gate the engineering team inherits. Unit tests + the full
# e2e gate + the chaos drills, on every PR — green on GitHub, not on a laptop.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: portable dependency boundary
        run: python3 scripts/check-portable-deps.py
      - name: portable contracts and local crash recovery without UI or cluster setup
        run: cargo test --locked -p supabricks-core -p supabricks-local

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # This job == `just verify-static`. Keep the two in lockstep.
      - name: rust format
        run: cargo fmt -- --check

      - name: cargo test (T1 unit + T2 snapshots + chart hardening contract)
        run: cargo test --locked --workspace

      - name: generated CRDs match crd.rs
        run: cargo run --locked --bin crdgen | diff -u chart/crds/sspc-crds.yaml -

      - name: helm lint
        run: helm lint chart

      - name: UI tests + build
        run: cd ui && npm ci --no-audit --no-fund && npm test && npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Hosted runners have ~14GB free; at peak the image set exists three
      # times (host docker storage + save-tar + kind-node containerd), so
      # drop all the preinstalled bloat we will never use.
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/lib/google-cloud-sdk /usr/local/share/powershell /opt/microsoft
          df -h /

      # Build the operator image with a layer cache so the cargo release
      # build doesn't cold-start every run. up.sh sees the tag and skips
      # its own build.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: sspc-operator:p1
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is loaded into the docker daemon and the layer cache is
      # exported to GHA — the local builder copy is pure disk pressure now.
      - name: reclaim local build cache
        run: docker builder prune -af && df -h /

      - name: kind cluster (the installer's own config)
        uses: helm/kind-action@v1
        with:
          cluster_name: sspc
          config: install/kind-config.yaml

      - name: install the platform (the real installer, CI mode)
        run: ./install/up.sh --yes

      - name: T3/T4 e2e gate
        run: ./e2e/run.sh

      - name: T6 chaos drills (operator kill, pageserver restart, node reboot)
        run: ./e2e/chaos.sh

      - name: T7 cold-attach restore (destroy local state, rebuild from bucket)
        run: ./e2e/restore.sh

      - name: failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/e2e-artifacts/
          if-no-files-found: ignore
