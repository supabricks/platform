# RFC 014 H5: the gate the engineering team inherits. Unit tests + the full
# e2e gate + the chaos drills, on every PR — green on GitHub, not on a laptop.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: platform}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform
      - name: cargo test (T1 unit + T2 schema snapshots)
        run: cargo test --locked

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: {run: {working-directory: platform}}
    steps:
      - uses: actions/checkout@v4

      # Hosted runners have ~14GB free; the Neon image set plus the
      # installer's save-tar needs more. Drop the preinstalled bloat.
      - name: free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      # Build the operator image with a layer cache so the cargo release
      # build doesn't cold-start every run. up.sh sees the tag and skips
      # its own build.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: platform
          tags: sspc-operator:p1
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: kind cluster (the installer's own config)
        uses: helm/kind-action@v1
        with:
          cluster_name: sspc
          config: platform/install/kind-config.yaml

      - name: install the platform (the real installer, CI mode)
        run: ./install/up.sh --yes

      - name: T3/T4 e2e gate
        run: ./e2e/run.sh

      - name: T6 chaos drills (operator kill, pageserver restart, node reboot)
        run: ./e2e/chaos.sh

      - name: failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: platform/e2e/e2e-artifacts/
          if-no-files-found: ignore
