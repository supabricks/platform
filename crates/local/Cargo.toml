[package]
name = "supabricks-local"
version = "0.1.0"
edition = "2024"

[dependencies]
supabricks-core = { path = "../core" }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.5"
libc = "0.2.189"
ureq = { version = "3.4.0", default-features = false, features = ["json"] }
chrono = "0.4.45"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
percent-encoding = "2.3.2"

[dev-dependencies]
tempfile = "3.27.0"
