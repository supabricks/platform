[package]
name = "supabricks-local"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
supabricks-core = { path = "../core" }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.5"
toml_edit = "=0.22.14"
libc = "0.2.189"
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
chrono = "0.4.45"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "net", "io-util", "sync", "macros"] }
tokio-postgres = "0.7.18"
futures-util = "0.3.32"
tiny_http = "0.12.0"
socket2 = "0.6.5"

semver = "1.0.28"
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.4"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
openidconnect = { version = "4", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
rsa = "0.9.10"

rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
