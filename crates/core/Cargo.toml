[package]
name = "supabricks-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.18.0"
base64 = "0.23.1"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
md-5 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
uuid = { version = "1", features = ["serde", "v4"] }
