[package]
name = "sspc-operator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.18.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
futures = "0.3.33"
hex = "0.4.3"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "client"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
rustls = "0.23.43"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
