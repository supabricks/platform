# sspc kind cluster (canonical copy for the installer): pre-maps the M1 port block (RFC 012 D3) plus debug ports.
# 30001-30020: per-endpoint NodePorts · 30080: MCP (P2) · 30098/30099: pageserver/controller HTTP (P0 debug)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sspc
nodes:
- role: control-plane
  extraPortMappings:
  - {containerPort: 30080, hostPort: 30080}
  - {containerPort: 30098, hostPort: 30098}
  - {containerPort: 30099, hostPort: 30099}
  - {containerPort: 30001, hostPort: 30001}
  - {containerPort: 30002, hostPort: 30002}
  - {containerPort: 30003, hostPort: 30003}
  - {containerPort: 30004, hostPort: 30004}
  - {containerPort: 30005, hostPort: 30005}
  - {containerPort: 30006, hostPort: 30006}
  - {containerPort: 30007, hostPort: 30007}
  - {containerPort: 30008, hostPort: 30008}
  - {containerPort: 30009, hostPort: 30009}
  - {containerPort: 30010, hostPort: 30010}
  - {containerPort: 30011, hostPort: 30011}
  - {containerPort: 30012, hostPort: 30012}
  - {containerPort: 30013, hostPort: 30013}
  - {containerPort: 30014, hostPort: 30014}
  - {containerPort: 30015, hostPort: 30015}
  - {containerPort: 30016, hostPort: 30016}
  - {containerPort: 30017, hostPort: 30017}
  - {containerPort: 30018, hostPort: 30018}
  - {containerPort: 30019, hostPort: 30019}
  - {containerPort: 30020, hostPort: 30020}
