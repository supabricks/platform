      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }

versionPins:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/AnalyticalVersion'
  post:
    operationId: pinAnalyticalVersion
    tags: [Analytics]
    summary: Pin an analytical version
    description: >-
      Holds the version for `ttl_seconds`, so that collecting does not delete
      it. A version can have many pins. A version that is `unavailable` or
      `deleting` is refused with `409`. An installation holds at most 1,024
      pins and answers `409` with `code: capacity_exhausted` beyond that. A
      governed server does not offer this through the API yet and answers
      `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/AnalyticalPinRequest' }
          example: { ttl_seconds: 3600 }
    responses:
      '201':
        description: The pin.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalPin' }
            example:
              id: pin_6e1f0a2b3c4d4e5f8a7b9c0d1e2f3a4b
              version_id: ver_95ac210ec99a4cd7826db045a3e38bf0
              expires_at: '2026-10-12T10:30:00.000Z'
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

pin:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/AnalyticalPin'
  patch:
    operationId: renewAnalyticalPin
    tags: [Analytics]
    summary: Make a pin last longer or shorter
    description: >-
      Sets the pin to expire `ttl_seconds` from now. A pin that has expired is
      gone and answers `404`. A governed server does not offer this through
      the API yet and answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/AnalyticalPinRequest' }
          example: { ttl_seconds: 3600 }
    responses:
      '200':
        description: The pin.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalPin' }
            example:
              id: pin_6e1f0a2b3c4d4e5f8a7b9c0d1e2f3a4b
              version_id: ver_95ac210ec99a4cd7826db045a3e38bf0
              expires_at: '2026-10-12T10:30:00.000Z'
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
  delete:
    operationId: releaseAnalyticalPin
    tags: [Analytics]
    summary: Release a pin
    description: >-
      The version is then held only by whatever else holds it. A governed
      server does not offer this through the API yet and answers `403` with
      `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    responses:
      '204':
        description: Released.
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

sessions:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: listAnalyticalSessions
    tags: [Analytics]
    summary: List the analytical sessions of a project
    description: >-
      Newest first, ended ones included. `active=true` leaves out sessions
      that are `closed` or `failed`. Sessions that notebooks run in are listed
      with `purpose: notebook`.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [AN-03]
    x-issues: [354, 355]
    parameters:
      - name: active
        in: query
        description: Only sessions that have not ended.
        schema: { type: boolean, default: false }
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
    responses:
      '200':
        description: A page of sessions.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalSessionPage' }
            example:
              items:
                - id: ses_1cc711be6c904212ab9cf8b17f5444af
                  project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
                  database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  version_id: ver_95ac210ec99a4cd7826db045a3e38bf0
                  refresh_id: null
                  purpose: query
                  state: starting
                  error: null
                  created_at: '2026-10-12T09:40:00.000Z'
                  expires_at: '2026-10-12T09:55:00.000Z'
                  spark_connect_url: null
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  post:
    operationId: openAnalyticalSession
    tags: [Analytics]
    summary: Open an analytical session
    description: >-
      Give `branch_id` to read the branch's current version, or `version_id`
      to read that one; exactly one of the two. A branch with no version yet
      gets a refresh started for it, and the session is `waiting` until that
      publishes. That refresh is refused with `409` while the installation is
      making another copy. The session is `ready` a few seconds after it is
      `starting`; read it with `getAnalyticalSession` until then. An
      installation runs two sessions at once, across every project, and
      answers `409` with `code: capacity_exhausted` when both are in use. It
      needs the database engines and the analytical runtime and answers `503`
      without them. A session over the project's catalog cannot be opened
      here. A governed server does not offer this through the API yet and
      answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-01, AN-03]
    x-issues: [354, 355]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/AnalyticalSessionOpen' }
          example: { branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c, ttl_seconds: 900 }
    responses:
      '201':
        description: The session.
        headers:
          Location: { schema: { type: string }, description: 'Where to read it.' }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalSession' }
            example:
              id: ses_1cc711be6c904212ab9cf8b17f5444af
              project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
              database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              version_id: ver_95ac210ec99a4cd7826db045a3e38bf0
              refresh_id: null
              purpose: query
              state: starting
              error: null
              created_at: '2026-10-12T09:40:00.000Z'
              expires_at: '2026-10-12T09:55:00.000Z'
              spark_connect_url: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }

