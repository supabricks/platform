    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-03]
    x-issues: [354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The session.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalSession' }
            example:
