sessionQuery:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/AnalyticalSession'
  post:
    operationId: runAnalyticalQuery
    tags: [Analytics]
    summary: Run a query in an analytical session
    description: >-
      One read-only Spark SQL statement against the session's version. The
      query is `running` when this returns; read it with `getAnalyticalQuery`.
      A session runs one query at a time and answers `409` while one is
      running, and keeps only its latest: this query's result replaces the one
      before. A running query cannot be cancelled by itself; closing the
      session cancels it. A session that is not `ready` answers `409`. A
      governed server does not offer this through the API yet and answers
      `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-01]
    x-issues: [353, 354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/AnalyticalQueryRun' }
          example: { sql: 'SELECT count(*) AS orders FROM orders' }
    responses:
      '201':
        description: The query, running.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalQuery' }
            example:
              id: aq_df723b7e36cc4510b82198781c591c94
              session_id: ses_1cc711be6c904212ab9cf8b17f5444af
              version_id: ver_95ac210ec99a4cd7826db045a3e38bf0
              state: running
              sql: SELECT count(*) AS orders FROM orders
              columns: null
              rows: null
              truncated: false
              error: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
  get:
    operationId: getAnalyticalQuery
    tags: [Analytics]
    summary: Get the latest query of an analytical session
    description: >-
      The query last run in the session, with its result once it is
      `complete`. Compare `id` with the one `runAnalyticalQuery` returned to
      know it is the same query. A session that has run none answers `404`.
      Values are text; numbers and dates are written as Spark writes them.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [AN-01]
    x-issues: [353, 354]
    responses:
      '200':
        description: The query.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalQuery' }
            example:
              id: aq_df723b7e36cc4510b82198781c591c94
              session_id: ses_1cc711be6c904212ab9cf8b17f5444af
              version_id: ver_95ac210ec99a4cd7826db045a3e38bf0
              state: complete
              sql: SELECT count(*) AS orders FROM orders
              columns: [{ name: orders, type: bigint }]
              rows: [['4']]
              truncated: false
              error: null
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
