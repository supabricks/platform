sessionClose:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/AnalyticalSession'
  post:
    operationId: closeAnalyticalSession
    tags: [Analytics]
    summary: Close an analytical session
