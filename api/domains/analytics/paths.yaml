# Analytics: the versions sync publishes of a branch's analytical copy, the
# sessions that read one, and the queries run in a session.
#
# A version is one published state of every table sync carried from a branch.
# It is made by a run of the branch's sync pipeline, or by a refresh asked for
# here. A session is a running Spark-compatible engine on one version; an
# installation runs two at once. A query is one read-only statement in a
# session, and a session keeps only its latest.
#
# The platform calls a version an epoch or a snapshot, and a pin a lease; the
# command line and its messages use those words.
#
# Every operation is for the owner of a local installation. A governed server
# authorizes analytical reads by grants and audits them, which this contract
# does not carry yet (#354), so there every operation answers `403` with
# `code: unavailable_in_profile`.

branchVersions:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Branch'
  get:
    operationId: listAnalyticalVersions
    tags: [Analytics]
    summary: List the analytical versions of a branch
    description: >-
      Newest first. A version whose files have been deleted is not listed.
      Table, row and size figures are those recorded when the version was
      made, and are null where it recorded none.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354, 355]
    parameters:
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
    responses:
      '200':
        description: A page of versions.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalVersionPage' }
            example:
              items:
                - id: ver_95ac210ec99a4cd7826db045a3e38bf0
                  project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
                  database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  sequence: 12
                  state: available
                  current: true
                  error: null
                  requested_at: '2026-10-12T09:30:00.000Z'
                  published_at: '2026-10-12T09:30:04.000Z'
                  source_lsn: 0/15BF2D8
                  pipeline_id: null
                  table_count: 1
                  row_count: 4
                  size_bytes: 3062
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }

branchCollect:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Branch'
  post:
    operationId: collectAnalyticalVersions
    tags: [Analytics]
    summary: Delete a branch's older analytical versions
    description: >-
      Keeps the branch's newest `keep` versions and marks the rest for
      deletion; their files are removed shortly after. The current version is
      always kept, and so is any version a session, a pin, a sync run or a
      catalog publication holds. At most 256 versions are marked in one call;
      call again for more. A governed server does not offer this through the
      API yet and answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/AnalyticalCollect' }
          example: { keep: 5 }
    responses:
      '200':
        description: What was marked.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalCollection' }
            example:
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              keep: 5
              deleting: [ver_0b1c2d3e4f5a4b6c8d7e9f0a1b2c3d4e]
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

branchRefreshes:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Branch'
  post:
    operationId: startAnalyticalRefresh
    tags: [Analytics]
    summary: Copy a branch's tables into a new analytical version now
    description: >-
      A full copy of every supported table, made once, without a sync
      pipeline. It needs the database engines and the analytical runtime and
      answers `503` without them. An installation makes one copy at a time and
      answers `409` while another is being made or cleared away. The refresh
      is read with `getAnalyticalRefresh` until it has `succeeded`, when
      `version_id` names what it published. A branch kept up to date by a sync
      pipeline does not need this. A governed server does not offer this
      through the API yet and answers `403` with `code:
      unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/AnalyticalRefreshRequest' }
          example: {}
    responses:
      '201':
        description: The refresh, running.
        headers:
          Location: { schema: { type: string }, description: 'Where to read it.' }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalRefresh' }
            example:
              id: rfr_4ece4e53f3994cbd83de6272865ddffa
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              state: running
              error: null
              version_id: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }

refresh:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/AnalyticalRefresh'
  get:
    operationId: getAnalyticalRefresh
    tags: [Analytics]
    summary: Get a refresh
    description: >-
      A refresh that a session started for itself, because its branch had no
      version, is read here too.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354]
    responses:
      '200':
        description: The refresh.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalRefresh' }
            example:
              id: rfr_4ece4e53f3994cbd83de6272865ddffa
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              state: running
              error: null
              version_id: null
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }

refreshCancel:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/AnalyticalRefresh'
  post:
    operationId: cancelAnalyticalRefresh
    tags: [Analytics]
    summary: Cancel a refresh
    description: >-
      Stops the copy and discards what it made. A refresh that already
      published its version is refused with `409`: the version stays.
      Cancelling one that has already ended changes nothing. A governed server
      does not offer this through the API yet and answers `403` with `code:
      unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [AN-02]
    x-issues: [354]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The refresh.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/AnalyticalRefresh' }
            example:
              id: rfr_4ece4e53f3994cbd83de6272865ddffa
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              state: cancelled
              error: cancelled
              version_id: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

version:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/AnalyticalVersion'
  get:
    operationId: getAnalyticalVersion
    tags: [Analytics]
    summary: Get an analytical version
