# Tables of a branch: what exists, how one is built, and its rows.
#
# Every operation here reads PostgreSQL through the server, with SQL the
# server writes itself, on the same four workers that run statements. A
# client never composes SQL to browse a table. Changing rows and changing a
# table's shape are not part of version 1; use a statement. Views, functions,
# sequences and other objects that are not read like a table live in the
# objects domain.

tables:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Database'
    - $ref: '../../shared/parameters.yaml#/Branch'
  get:
    operationId: listTables
    tags: [Tables]
    summary: List the tables and views of a branch
    description: >-
      Everything that can be read like a table: tables, partitioned tables,
      views, materialized views and foreign tables, in every schema but
      PostgreSQL's own. Ordered by schema, then name. `row_estimate` is
      PostgreSQL's own estimate from its statistics, not a count. Reading a
      suspended branch resumes it. Refused with `429` while the server's four
      statement workers are busy, and with `503` without the database
      engines. A governed server does not offer this yet and answers `403`
      with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [TE-01, OE-01]
    x-issues: [257, 260, 328]
    parameters:
      - name: schema
        in: query
        description: Only tables in this schema.
        schema: { type: string, minLength: 1, maxLength: 63 }
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
    responses:
      '200':
        description: A page of tables.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/TablePage' }
            example:
              items:
                - schema: public
                  name: customers
                  kind: table
                  row_estimate: 48210
                  size_bytes: 9166848
                  comment: null
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '429': { $ref: '../../shared/responses.yaml#/TooManyRequests' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }

table:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Database'
    - $ref: '../../shared/parameters.yaml#/Branch'
    - $ref: '../../shared/parameters.yaml#/Schema'
    - $ref: '../../shared/parameters.yaml#/Table'
  get:
    operationId: getTable
    tags: [Tables]
    summary: Get a table's columns, keys, indexes and constraints
    description: >-
      Definitions are PostgreSQL's own text. For a view, `columns` is what it
      returns and the rest is empty. Triggers, row-level security policies,
      the full `CREATE` statement, owner and privileges are not part of
      version 1.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [TE-04, OE-02]
    x-issues: [260, 328]
    responses:
      '200':
        description: The table.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/TableDetail' }
            example:
              schema: public
              name: customers
              kind: table
              row_estimate: 48210
              size_bytes: 9166848
              comment: null
              columns:
                - { name: id, type: bigint, nullable: false, default: null, generated: false, identity: true, comment: null }
                - { name: email, type: text, nullable: true, default: null, generated: false, identity: false, comment: null }
              primary_key: [id]
              indexes:
                - { name: customers_pkey, unique: true, primary: true, definition: 'CREATE UNIQUE INDEX customers_pkey ON public.customers USING btree (id)' }
              constraints:
                - { name: customers_pkey, kind: primary_key, definition: 'PRIMARY KEY (id)' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '429': { $ref: '../../shared/responses.yaml#/TooManyRequests' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }

tableRows:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Database'
    - $ref: '../../shared/parameters.yaml#/Branch'
    - $ref: '../../shared/parameters.yaml#/Schema'
    - $ref: '../../shared/parameters.yaml#/Table'
  get:
    operationId: listTableRows
    tags: [Tables]
    summary: Read a table's rows a page at a time
    description: >-
      Rows in the order asked for, then by primary key, so pages do not
      overlap or skip while nothing is written. Pages are not a snapshot: a
      row written between two pages can appear twice or not at all. A table
      without a primary key is ordered by where its rows are stored; a view
      has no order of its own, so give `sort`.


      Every value is PostgreSQL's text form of it and a SQL null is null, so
      an empty string and a null differ. A value longer than 2000 characters
      is cut to 2000 and listed in `truncated`. A page larger than 256 KiB is
      refused with `422` and `code: result_too_large`; ask for fewer rows.
      A `cursor` continues the listing it was issued for and is refused with
      another `sort`, `order` or `filter`. A request whose URL and headers
      together exceed 16 KiB is refused with `431` before it is read.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [TE-02, OE-01]
    x-issues: [257, 258, 328]
    parameters:
      - name: sort
        in: query
        description: A column to order by.
        schema: { type: string, minLength: 1, maxLength: 63 }
      - name: order
        in: query
        description: The direction of `sort`. Nulls come last ascending and first descending.
        schema: { type: string, enum: [asc, desc], default: asc }
      - name: filter
        in: query
        description: >-
          Conditions a row must all meet, as a JSON array of at most 8
          objects, for example
          `[{"column":"email","op":"contains","value":"@example.com"}]`. The
          operators are `eq`, `ne`, `lt`, `lte`, `gt`, `gte`, `contains`,
          `is_null` and `not_null`. A value is text, read as the column's
          type; `contains` matches the value's text form, ignoring case.
          `is_null` and `not_null` take no value. A value is at most 256 characters.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/RowFilters' }
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
    responses:
      '200':
        description: A page of rows.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/RowPage' }
            example:
              columns:
                - { name: id, type: bigint }
                - { name: email, type: text }
              primary_key: [id]
              items:
                - ['1', ada@example.com]
                - ['2', null]
              truncated: []
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '422':
        description: The page is larger than the server returns at once.
        content:
          application/problem+json:
            schema: { $ref: '../../shared/schemas.yaml#/Problem' }
      '431':
        description: The URL and headers are larger than the server reads. There is no body.
      '429': { $ref: '../../shared/responses.yaml#/TooManyRequests' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }
