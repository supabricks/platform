      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  post:
    operationId: startSyncRun
    tags: [Sync]
    summary: Run a sync pipeline now
    description: >-
      Queues one run of a `snapshot` or `triggered` pipeline. The reply is
