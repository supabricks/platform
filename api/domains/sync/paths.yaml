pipelineResume:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Pipeline'
  post:
    operationId: resumeSyncPipeline
    tags: [Sync]
    summary: Resume a sync pipeline
    description: >-
      Makes a paused pipeline `active` again. A scheduled pipeline is next due
      one interval from now. After a reviewed resync this is the step that
      starts the new capture and its full copy. Refused with `409` while the
      pipeline is still pausing or its resync is still cleaning up, and for a
      `blocked` pipeline whose branch is gone. `triggered` and `continuous` need
      the database engines and answer `400` without them. A governed server does
      not offer this through the API yet and answers `403` with `code:
      unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [SY-07]
    x-issues: [348]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IfMatchRequired'
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    responses:
