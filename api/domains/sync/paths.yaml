              finished_at: '2026-10-12T09:31:05.000Z'
              version_id: null
              source_lsn: null
              batches: 0
              error: user_cancelled
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

pipelineResyncReview:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Pipeline'
  get:
    operationId: reviewSyncResync
    tags: [Sync]
    summary: See what a full resync of a pipeline would do
    description: >-
      States the effect of starting a `triggered` or `continuous` pipeline
      over from a full copy, and returns the `review_hash` that `resyncSyncPipeline`
      must be sent. The hash changes whenever the pipeline or its capture
      does, so what was reviewed is what is done. A `snapshot` pipeline has
      nothing to resync and answers `409`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [SY-07]
    x-issues: [348]
    responses:
      '200':
        description: The review.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncResyncReview' }
            example:
              pipeline_id: sync_7a1c5e9b3d2f4c8a9e0b1d3f5a7c9e2b
              revision: 4
              effect: Cancel active work, pause the policy and retire its capture. Published epochs and existing readers remain pinned. After cleanup, explicitly resume to create a new capture and full bootstrap.
              requires_full_copy: true
              deletes_published_versions: false
              review_hash: 9f2c4e6a8b0d1f3a5c7e9b1d3f5a7c9e2b4d6f8a0c2e4a6b8d0f1a3c5e7b9d1f
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

pipelineResync:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Pipeline'
  post:
    operationId: resyncSyncPipeline
    tags: [Sync]
    summary: Start a pipeline over from a full copy
    description: >-
      The second step after `reviewSyncResync`. Cancels the pipeline's work,
      pauses it and retires its capture; its `error` is then
      `resync_cleanup_pending`. Published versions and their readers are
      kept. Once the cleanup is done, `resumeSyncPipeline` makes the new
      capture and the full copy. A `review_hash` that no longer matches is
      refused with `409`: review again. A governed server does not offer this through the API yet and answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [SY-07, SY-08]
    x-issues: [348]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IfMatchRequired'
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/SyncResync' }
          example: { review_hash: 9f2c4e6a8b0d1f3a5c7e9b1d3f5a7c9e2b4d6f8a0c2e4a6b8d0f1a3c5e7b9d1f }
    responses:
      '200':
        description: The pipeline, paused.
        headers: { ETag: { schema: { type: string } } }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncPipeline' }
            example:
              id: sync_7a1c5e9b3d2f4c8a9e0b1d3f5a7c9e2b
              project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
              database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              mode: snapshot
              state: paused
              error: resync_cleanup_pending
              schedule: { interval_seconds: 3600 }
              continuous: null
              limits: { max_bytes: 1073741824, timeout_ms: 300000 }
              created_at: '2026-10-12T09:30:00.000Z'
              next_run_at: '2026-10-12T10:30:00.000Z'
              last_success_at: null
              last_version_id: null
              capture: null
              freshness: null
              revision: 1
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '412': { $ref: '../../shared/responses.yaml#/PreconditionFailed' }
      '428': { $ref: '../../shared/responses.yaml#/PreconditionRequired' }

source:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Branch'
  get:
    operationId: getSyncSource
    tags: [Sync]
    summary: See whether a branch can be given a sync pipeline
    description: >-
      What the platform requires of a branch's tables, whether the branch is
      running now, and the pipeline it already has, if any. The branch's
      tables are not examined: whether they qualify is found when a
      pipeline's first run starts.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [SY-02]
    x-issues: [350, 348]
    responses:
      '200':
        description: What sync needs of the branch.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncSource' }
            example:
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              available: true
              pipeline_id: null
              tables_checked: false
              requirements:
                - Logged public tables with one integer primary key
                - Integer, text/varchar and bounded numeric columns
                - No RLS, schema changes or unsupported application objects
                - One capture per installation; retained WAL and spool budgets apply
              modes: [snapshot, triggered, continuous]
              continuous_keeps_compute_awake: true
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
