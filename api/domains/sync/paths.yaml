# Sync: carrying a branch's PostgreSQL tables into the analytical copy.
#
# A pipeline belongs to one branch and carries every supported table of it as
# one unit; a branch has at most one. It runs in one of three modes: a full
# snapshot on a schedule or on request, changes applied when asked
# (`triggered`), or changes applied continuously. Each run that succeeds
# publishes a new analytical version of the branch.
#
# The platform calls a pipeline a policy; the command line and its messages
# use that word.
#
# Every operation is for the owner of a local installation. A governed server
# authorizes sync by grants on each branch and runs a pipeline as a service
# principal, which this contract does not carry yet (#348), so there every
# operation answers `403` with `code: unavailable_in_profile`.

pipelines:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: listSyncPipelines
    tags: [Sync]
    summary: List the sync pipelines of a project
    description: >-
      Ordered by when they were created, oldest first. A deleted pipeline is
      not listed. `branch_id` narrows the list to the pipeline of one branch,
      which is one or none. Which tables a pipeline carries, and their rows,
      are not reported in version 1.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [SY-01]
    x-issues: [347, 348]
    parameters:
      - name: branch_id
        in: query
        description: Only the pipeline of this branch.
        schema: { $ref: '../../shared/schemas.yaml#/Id' }
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
    responses:
      '200':
        description: A page of pipelines.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncPipelinePage' }
            example:
              items:
                - id: sync_7a1c5e9b3d2f4c8a9e0b1d3f5a7c9e2b
                  project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
                  database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  mode: snapshot
                  state: active
                  error: null
                  schedule: { interval_seconds: 3600 }
                  continuous: null
                  limits: { max_bytes: 1073741824, timeout_ms: 300000 }
                  created_at: '2026-10-12T09:30:00.000Z'
                  next_run_at: '2026-10-12T10:30:00.000Z'
                  last_success_at: null
                  last_version_id: null
                  capture: null
                  freshness: null
                  revision: 1
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  post:
    operationId: createSyncPipeline
    tags: [Sync]
    summary: Create a sync pipeline for a branch
    description: >-
      The pipeline starts `active`. With a schedule its first run is due one
      interval from now; without one, a `snapshot` or `triggered` pipeline
      runs only when asked, and a `continuous` one starts by itself. A branch
      that already has a pipeline is refused with `409` and
      `code: pipeline_exists`. `triggered` and `continuous` need the database
      engines and the analytical runtime and answer `503` without them. An
      installation captures changes from one branch at a time, so a second
      `triggered` or `continuous` pipeline is refused with `409` and
      `code: capacity_exhausted`. Whether the branch's tables qualify is found
      when the first run starts, not here. A governed server does not offer this through the API yet and answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [SY-02]
    x-issues: [348, 350]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/SyncPipelineCreate' }
          example:
            branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
            mode: snapshot
            schedule: { interval_seconds: 3600 }
    responses:
      '201':
        description: The pipeline.
        headers:
          ETag: { schema: { type: string } }
          Location: { schema: { type: string }, description: 'Where to read the pipeline.' }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncPipeline' }
            example:
              id: sync_7a1c5e9b3d2f4c8a9e0b1d3f5a7c9e2b
              project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
              database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              mode: snapshot
              state: active
              error: null
              schedule: { interval_seconds: 3600 }
              continuous: null
              limits: { max_bytes: 1073741824, timeout_ms: 300000 }
              created_at: '2026-10-12T09:30:00.000Z'
              next_run_at: '2026-10-12T10:30:00.000Z'
              last_success_at: null
              last_version_id: null
              capture: null
              freshness: null
              revision: 1
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }

pipeline:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Pipeline'
  get:
    operationId: getSyncPipeline
    tags: [Sync]
    summary: Get a sync pipeline
    description: >-
      The `ETag` is the pipeline's revision; send it in `If-Match` to change
      the pipeline. For a `continuous` pipeline `freshness` is worked out as
      it is read, so two reads a moment apart can differ while the revision
      stays the same. Its history is not kept in version 1.
    x-backend: ready
    x-required-role: viewer
    x-profiles: [local]
    x-console-features: [SY-03, SY-08]
    x-issues: [347, 348]
    responses:
      '200':
        description: The pipeline.
        headers: { ETag: { schema: { type: string } } }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncPipeline' }
            example:
              id: sync_7a1c5e9b3d2f4c8a9e0b1d3f5a7c9e2b
              project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
              database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              mode: snapshot
              state: active
              error: null
              schedule: { interval_seconds: 3600 }
              continuous: null
              limits: { max_bytes: 1073741824, timeout_ms: 300000 }
              created_at: '2026-10-12T09:30:00.000Z'
              next_run_at: '2026-10-12T10:30:00.000Z'
              last_success_at: null
              last_version_id: null
              capture: null
              freshness: null
              revision: 1
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  patch:
    operationId: updateSyncPipeline
    tags: [Sync]
    summary: Change how a sync pipeline runs
    description: >-
      Send only what changes; the rest stays as it is. `schedule: null`
      removes the schedule. Any change cancels the pipeline's run in
      progress, and its `error` is then `policy_revised`. Changing between
      `snapshot` and the other two modes is refused with `409` until the
      pipeline is paused and its capture is gone; delete the pipeline and
      create it again in the new mode. A request that changes nothing leaves
      the revision as it is. A governed server does not offer this through the API yet and answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [SY-06]
    x-issues: [348]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IfMatchRequired'
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/SyncPipelineUpdate' }
          example: { schedule: { interval_seconds: 900 } }
    responses:
      '200':
        description: The updated pipeline.
        headers: { ETag: { schema: { type: string } } }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncPipeline' }
            example:
              id: sync_7a1c5e9b3d2f4c8a9e0b1d3f5a7c9e2b
              project_id: prj_4f9a2c1e8b7d4a6f9c3e5b1d7a2f8c4e
              database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              mode: snapshot
              state: active
              error: null
              schedule: { interval_seconds: 3600 }
              continuous: null
              limits: { max_bytes: 1073741824, timeout_ms: 300000 }
              created_at: '2026-10-12T09:30:00.000Z'
              next_run_at: '2026-10-12T10:30:00.000Z'
              last_success_at: null
              last_version_id: null
              capture: null
              freshness: null
              revision: 1
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '412': { $ref: '../../shared/responses.yaml#/PreconditionFailed' }
      '428': { $ref: '../../shared/responses.yaml#/PreconditionRequired' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }
  delete:
    operationId: deleteSyncPipeline
    tags: [Sync]
    summary: Delete a sync pipeline
    description: >-
      Cancels its run in progress and retires its capture. The analytical
      versions it published stay, and so does everything reading them. The
      branch can then be given a new pipeline. Deleting one that is already
      deleted is `404`. A governed server does not offer this through the API yet and answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [SY-06, SY-07]
    x-issues: [348]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IfMatchRequired'
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    responses:
      '204': { $ref: '../../shared/responses.yaml#/NoContent' }
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '412': { $ref: '../../shared/responses.yaml#/PreconditionFailed' }
      '428': { $ref: '../../shared/responses.yaml#/PreconditionRequired' }

