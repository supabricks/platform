runCancel:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/SyncRun'
  post:
    operationId: cancelSyncRun
    tags: [Sync]
    summary: Cancel a sync run
    description: >-
      Stops a run that has not finished; nothing it prepared is published. A
      run that already failed or was cancelled is returned as it is. A run
      that succeeded has published its version and is refused with `409`.
      Cancelling the run of a `continuous` pipeline pauses the pipeline.
      Cancelling a `triggered` run in the middle of applying leaves its
      capture unusable: the pipeline then needs a reviewed resync. A governed server does not offer this through the API yet and answers `403` with `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [SY-04, SY-07]
    x-issues: [348]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: The run as it is now.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/SyncRun' }
            example:
              id: run_2b4d6f8a1c3e4a5b8d7f9e0c1a2b3c4d
              pipeline_id: sync_7a1c5e9b3d2f4c8a9e0b1d3f5a7c9e2b
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              trigger: manual
              state: cancelled
              created_at: '2026-10-12T09:31:00.000Z'
