# Projects: the container for everything else.
#
# A project is one instance: its own databases, notebooks, jobs and access. The
# same source can be created more than once (staging and production); those are
# separate projects. The installation runs once, so a project is never started
# or stopped.

projects:
  get:
    operationId: listProjects
    tags: [Projects]
    summary: List projects
    description: >-
      Projects the caller can open, ordered by name. In the governed profile
      that is every project where they hold a role.
    x-backend: ready
    x-required-role: any
    x-console-features: [HM-01]
    parameters:
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
      - { name: q, in: query, description: 'Only projects whose name contains this text.', schema: { type: string } }
    responses:
      '200':
        description: A page of projects.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/ProjectPage' }
            example:
              items:
                - id: prj_5f0c2a9e7b1d4c3fa8e6d2b4c1a09f73
                  name: sales-analytics
                  description: ''
                  source_id: src_0b7e4d1c9a2f4e6d8c3b5a7f1e2d4c6b
                  created_at: '2026-10-10T14:05:00Z'
                  revision: 1
                  counts: { databases: 1, branches: 3 }
                  my_role: null
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
  post:
    operationId: createProject
    tags: [Projects]
    summary: Create a project
    description: >-
      Creates a new, empty project and its first database, `main`. The caller
      becomes its administrator. The reply is the operation that prepares the
      project; its `target` is the new project, which can be read at once. To
      create another project from a source that already exists (a staging
      copy), import it instead. Starting from the sample tables is not part of
      version 1. A name that another project
      already has is refused with `409` and `code: name_taken`, including when
      the same source is created again.
    x-backend: ready
    x-required-role: any
    x-console-features: [HM-01, FR-02]
    x-issues: [315]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: './schemas.yaml#/ProjectCreate' } } }
    responses:
      '202': { $ref: '../../shared/responses.yaml#/Accepted' }
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

project:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: getProject
    tags: [Projects]
    summary: Get a project
    description: The `ETag` is the project's revision; send it in `If-Match` to rename or delete.
    x-backend: ready
    x-required-role: viewer
    x-console-features: [HM-01]
    responses:
      '200':
        description: The project.
        headers: { ETag: { schema: { type: string } } }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/Project' }
            example:
              id: prj_5f0c2a9e7b1d4c3fa8e6d2b4c1a09f73
              name: sales-analytics
              description: Orders, customers and the dashboards built on them
              source_id: src_0b7e4d1c9a2f4e6d8c3b5a7f1e2d4c6b
              created_at: '2026-10-10T14:05:00Z'
              revision: 4
              counts: { databases: 1, branches: 3 }
              my_role: administrator
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  patch:
    operationId: updateProject
    tags: [Projects]
    summary: Rename a project or change its description
    description: >-
      Renaming keeps the project ID, so datasets other projects read from it
      keep working. It changes this project only, not others created from the
      same source. A name already in use is refused with `409` and
      `code: name_taken`.
    x-backend: new
    x-required-role: administrator
    x-console-features: [HM-01b, ST-02]
    x-issues: [287, 314]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IfMatch'
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: './schemas.yaml#/ProjectUpdate' } } }
    responses:
      '200':
        description: The updated project.
        headers: { ETag: { schema: { type: string } } }
        content: { application/json: { schema: { $ref: './schemas.yaml#/Project' } } }
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '412': { $ref: '../../shared/responses.yaml#/PreconditionFailed' }
  delete:
    operationId: deleteProject
    tags: [Projects]
    summary: Delete a project and everything in it
    description: >-
      Irreversible. Read the deletion impact first and show it to the person.
      Refused with `409` while another project reads a dataset this one
      publishes, unless `force` is true.
    x-backend: new
    x-required-role: administrator
    x-console-features: [HM-01b]
    x-issues: [287]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IfMatchRequired'
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
      - { name: confirm, in: query, required: true, description: 'The project name, typed by the person.', schema: { type: string } }
      - { name: force, in: query, schema: { type: boolean, default: false } }
    responses:
      '202': { $ref: '../../shared/responses.yaml#/Accepted' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '412': { $ref: '../../shared/responses.yaml#/PreconditionFailed' }
      '428': { $ref: '../../shared/responses.yaml#/PreconditionRequired' }

projectDeletionImpact:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: getProjectDeletionImpact
    tags: [Projects]
    summary: See what deleting a project would remove
    x-backend: new
    x-required-role: administrator
    x-console-features: [HM-01b]
    x-issues: [287]
    responses:
      '200':
        description: What would be removed, and what blocks it.
        content: { application/json: { schema: { $ref: './schemas.yaml#/DeletionImpact' } } }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }

projectMap:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: getProjectMap
    tags: [Projects]
    summary: Get the project map
    description: Databases, pipelines, analytical tables and their readers as one graph, for the project overview.
    x-backend: new
    x-required-role: viewer
    x-console-features: [HM-05]
    responses:
      '200':
        description: The map.
        content: { application/json: { schema: { $ref: './schemas.yaml#/ProjectMap' } } }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }

projectRecents:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: listRecentItems
    tags: [Projects]
    summary: List what the caller used recently in a project
    description: Per person. Never includes something the caller can no longer open.
    x-backend: new
    x-required-role: viewer
    x-console-features: [HM-02]
    x-issues: [286]
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
    responses:
      '200':
        description: Recent items, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: './schemas.yaml#/RecentItem' } }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
