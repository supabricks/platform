Project:
  type: object
  description: >-
    A project holds databases, sync pipelines, notebooks, jobs and saved queries
    that belong together, with its own access policy. It is one instance: two
    projects created from the same source share nothing.
  required: [id, name, description, source_id, created_at, revision, counts, my_role]
  properties:
    id: { $ref: '../../shared/schemas.yaml#/Id' }
    name: { $ref: './schemas.yaml#/ProjectName' }
    description: { type: string, maxLength: 500, description: 'Empty when none was given.' }
    source_id:
      allOf: [{ $ref: '../../shared/schemas.yaml#/Id' }]
      description: >-
        The source this project was created from. It travels with the project
        definition (`supabricks.toml`), so projects created from one source,
        here or in another installation, share it.
    path:
      type: string
      description: >-
        Folder that holds the project definition. Local profile only; a
        governed server never reveals its own paths.
    created_at:
      allOf: [{ $ref: '../../shared/schemas.yaml#/Timestamp' }]
      description: >-
        When the project was created. For a project that existed before the
        server recorded this, the time of the upgrade that started recording it.
    revision: { $ref: '../../shared/schemas.yaml#/Revision' }
    counts:
      type: object
      description: What the project holds now. Counts for other kinds are added with their domains.
      required: [databases, branches]
      properties:
        databases: { type: integer, minimum: 0 }
        branches: { type: integer, minimum: 0, description: 'Including the default branch of each database.' }
    my_role:
      description: The caller's effective role in this project. Null in the local profile, where the owner can do everything.
      oneOf:
        - { type: string, enum: [viewer, editor, administrator] }
        - { type: 'null' }

ProjectName:
  type: string
  description: >-
    Chosen by the person. Required when a project is created through this API;
    there is no default. Unique in the installation, compared without regard to
    case, so a source imported twice needs two names (`sales-analytics` and
    `sales-analytics-staging`). Letters, digits and hyphens, at most 40
    characters, stored in lower case.
  pattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]{0,38}[a-zA-Z0-9])?$'
  examples: [sales-analytics]

ProjectCreate:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name: { $ref: './schemas.yaml#/ProjectName' }
    description: { type: string, maxLength: 500 }

ProjectUpdate:
  type: object
  minProperties: 1
  additionalProperties: false
  properties:
    name: { $ref: './schemas.yaml#/ProjectName' }
    description: { type: string, maxLength: 500 }

ProjectPage:
  allOf:
    - $ref: '../../shared/schemas.yaml#/PageInfo'
    - type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: './schemas.yaml#/Project' } }

DeletionImpact:
  type: object
  description: What deleting the project removes and what stops it, so the caller can show both before asking for confirmation.
  required: [removes, blocked_by]
  additionalProperties: false
  properties:
    removes:
      type: object
      description: Counts for other kinds are added with their domains.
      required: [databases, branches]
      properties:
        databases: { type: integer, minimum: 0 }
        branches: { type: integer, minimum: 0 }
    blocked_by:
      type: array
      description: Empty when the project can be deleted now.
      items:
        type: object
        required: [reason, count]
        properties:
          reason:
            type: string
            enum: [read_by_another_project, sync_pipelines, publications, analytical_data, running_work]
            description: >-
              `read_by_another_project`: another project uses a dataset this
              one publishes. `sync_pipelines`, `publications`,
              `analytical_data`: these exist and must be removed first.
              `running_work`: an import or analytical session is active.
          count: { type: integer, minimum: 1 }

ProjectMap:
  type: object
  description: >-
    The project as a graph: databases and branches, the pipelines that publish
    them, the analytical tables that result, and what reads those. Assembled by
    the platform so the console makes one request for its overview.
  required: [nodes, edges]
  properties:
    nodes:
      type: array
      items:
        type: object
        required: [ref, engine, state]
        properties:
          ref: { $ref: '../../shared/schemas.yaml#/ResourceRef' }
          engine: { type: string, enum: [postgres, analytics, none], description: 'Which side of the product the node belongs to.' }
          state: { type: string }
          summary: { type: string, description: 'One line for display, for example "3 tables, 4.3 GB".' }
          freshness_ms: { type: integer, description: 'For analytical nodes, how far behind PostgreSQL they are.' }
    edges:
      type: array
      items:
        type: object
        required: [from, to, kind]
        properties:
          from: { type: string, description: '`<kind>:<id>` of the source node.' }
          to: { type: string }
          kind: { type: string, enum: [branch_of, publishes, reads, shares_from] }

RecentItem:
  type: object
  required: [resource, at]
  properties:
    resource: { $ref: '../../shared/schemas.yaml#/ResourceRef' }
    at: { $ref: '../../shared/schemas.yaml#/Timestamp' }
    action: { type: string, enum: [opened, ran, edited] }
