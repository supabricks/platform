# Imports: a file loaded into a new PostgreSQL table.
#
# A client creates a source, sends the file's bytes, and the server inspects
# them: it proposes columns and returns a sample. The client then creates an
# import, which loads the whole file into a new table in one transaction, so
# a table either holds every row or does not exist. The server keeps a source
# for 24 hours and runs one import at a time.

importSources:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: listImportSources
    tags: [Imports]
    summary: List the files a project has uploaded
    description: >-
      The sources the server still keeps, the one that expires last first,
      without their inspections.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [IM-01]
    x-issues: [332]
    parameters:
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
    responses:
      '200':
        description: A page of sources.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/ImportSourcePage' }
            example:
              items:
                - id: src_9d2b4f6a8c0e1a3c5e7f9b1d3f5a7c9e
                  name: customers.csv
                  state: ready
                  size_bytes: 48213
                  received_bytes: 48213
                  sha256: 4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a
                  error: null
                  expires_at: '2026-10-12T09:30:00.000Z'
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  post:
    operationId: createImportSource
    tags: [Imports]
    summary: Declare a file to upload
    description: >-
      Reserves room for a file of exactly `size_bytes` and says how it is to be
      read. Nothing is uploaded yet: send the bytes to the source's `content`.
      The content must start arriving within 30 seconds, and all of it within
      ten minutes, or the source is deleted.


      Files waiting on the server share 512 MiB across the installation, and a
      source that has not finished arriving counts as 100 MiB whatever its
      size; beyond that the request is refused with `409` and
      `code: capacity_exhausted` until a source is deleted or expires. A repeat
      with the same `Idempotency-Key` answers with the first reply. A governed
      server does not offer imports yet and answers `403` with
      `code: unavailable_in_profile`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [IM-01]
    x-issues: [312, 332]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/ImportSourceCreate' }
          example: { name: customers.csv, size_bytes: 48213, format: csv }
    responses:
      '201':
        description: The source, waiting for its content.
        headers:
          Location: { schema: { type: string }, description: 'Where to read the source.' }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/ImportSource' }
            example:
              id: src_9d2b4f6a8c0e1a3c5e7f9b1d3f5a7c9e
              name: customers.csv
              state: receiving
              size_bytes: 48213
              received_bytes: 0
              sha256: null
              error: null
              expires_at: '2026-10-12T09:30:00.000Z'
              inspection: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '429': { $ref: '../../shared/responses.yaml#/TooManyRequests' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }

importSource:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/ImportSource'
  get:
    operationId: getImportSource
    tags: [Imports]
    summary: Get a source and what its inspection found
    description: >-
      Read it until `state` leaves `inspecting`. A source is `404` once it has
      been deleted, has expired, or an import from it has succeeded or been
      cancelled. A source does not outlive a restart of the server: it becomes
      `failed` with `error: server_restarted`.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [IM-01]
    x-issues: [332]
    responses:
      '200':
        description: The source.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/ImportSource' }
            example:
              id: src_9d2b4f6a8c0e1a3c5e7f9b1d3f5a7c9e
              name: customers.csv
              state: ready
              size_bytes: 48213
              received_bytes: 48213
              sha256: 4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a
              error: null
              expires_at: '2026-10-12T09:30:00.000Z'
              inspection:
                format: csv
                delimiter: ','
                header: true
                null_strings: []
                columns:
                  - { input: '0', name: id, type: { kind: text }, nullable: true }
                  - { input: '1', name: email, type: { kind: text }, nullable: true }
                sample_rows:
                  - ['1', ada@example.com]
                  - ['2', null]
                source_columns: null
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  delete:
    operationId: deleteImportSource
    tags: [Imports]
    summary: Delete a source and its file
    description: >-
      Stops an inspection of it, if one is running. Refused with `409` while
      an import is loading from it. Imports that used it stay in the history
      and can no longer be retried.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [IM-01]
    x-issues: [332]
    responses:
      '204': { $ref: '../../shared/responses.yaml#/NoContent' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }

importSourceContent:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/ImportSource'
  put:
    operationId: uploadImportSource
    tags: [Imports]
    summary: Send a source's bytes
    description: >-
      The body is the file itself, as `application/octet-stream`, and must be
      exactly the `size_bytes` the source was created with. When the last byte
      has arrived the server starts inspecting the file as the source says to
      read it, and answers with the source in `state: inspecting`.


      A source takes its content once. If the upload is interrupted, is a
      different size, or cannot be stored, the source is deleted and the
      request answers `400`; create another. The server inspects one file at a
      time across the installation: while it is busy an upload is refused with
      `429` before any byte is stored, and the source is kept so the upload
      can be tried again within 30 seconds.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [IM-01]
    x-issues: [332]
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary, maxLength: 104857600 }
    responses:
      '200':
        description: The source, being inspected.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/ImportSource' }
            example:
              id: src_9d2b4f6a8c0e1a3c5e7f9b1d3f5a7c9e
              name: customers.csv
              state: inspecting
              size_bytes: 48213
              received_bytes: 48213
              sha256: null
              error: null
              expires_at: '2026-10-12T09:30:00.000Z'
              inspection: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
      '415':
        description: The body was not sent as `application/octet-stream`.
        content:
          application/problem+json:
            schema: { $ref: '../../shared/schemas.yaml#/Problem' }
      '429': { $ref: '../../shared/responses.yaml#/TooManyRequests' }
      '503': { $ref: '../../shared/responses.yaml#/Unavailable' }

importSourceInspect:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/ImportSource'
  post:
    operationId: inspectImportSource
    tags: [Imports]
    summary: Inspect a source again, read another way
    description: >-
      For a source that is `ready`: reads it with another format, delimiter,
      header setting or null strings, and replaces its inspection. An import
      reads the file the way its last inspection did. If the file cannot be
