        description: Only imports into this branch.
        schema: { $ref: '../../shared/schemas.yaml#/Id' }
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
    responses:
      '200':
        description: A page of imports.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/ImportPage' }
            example:
              items:
                - id: imp_1f3a5c7e9b2d4f6a8c0e2a4b6d8f1c3e
                  source_id: src_9d2b4f6a8c0e1a3c5e7f9b1d3f5a7c9e
                  source_name: customers.csv
                  database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
                  schema: public
                  table: customers
                  format: csv
                  columns:
                    - { input: '0', name: id, type: { kind: bigint }, nullable: false }
                    - { input: '1', name: email, type: { kind: text }, nullable: true }
                  state: succeeded
                  attempts: 1
                  cancel_requested: false
                  parsed_rows: 1200
                  copied_rows: 1200
                  committed_rows: 1200
                  retryable: false
                  error: null
                  updated_at: '2026-10-11T09:31:04.000Z'
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
  post:
    operationId: createImport
    tags: [Imports]
    summary: Load a source into a new table
    description: >-
      Queues the load and answers at once; read the import until it reaches
      `succeeded`, `failed` or `cancelled`. The whole file is loaded in one
      transaction into a table the import creates, so the table holds every
      row or does not exist. A table of that name already there fails the
      import with `error: target_exists` and is left as it was. The schema
      must exist: without it the import fails with `error: postgres_3F000`.
      The file is read the way the source's last inspection read it. Once an
      import from a source has succeeded or been cancelled the server deletes
      the source; after a failure it is kept, so the import can be retried.


      The branch must be running, and the source `ready` with an inspection;
      otherwise the request is refused with `409`. The server runs one import
      at a time across the installation: another is refused with `429`. A
      repeat with the same `Idempotency-Key` answers with the first import and
      loads nothing again.
    x-backend: ready
    x-required-role: editor
    x-profiles: [local]
    x-console-features: [IM-01]
    x-issues: [311, 313, 332]
    parameters:
      - $ref: '../../shared/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas.yaml#/ImportCreate' }
          example:
            source_id: src_9d2b4f6a8c0e1a3c5e7f9b1d3f5a7c9e
            branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
            table: customers
    responses:
      '201':
        description: The import, queued.
        headers:
          Location: { schema: { type: string }, description: 'Where to read the import.' }
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/Import' }
            example:
              id: imp_1f3a5c7e9b2d4f6a8c0e2a4b6d8f1c3e
              source_id: src_9d2b4f6a8c0e1a3c5e7f9b1d3f5a7c9e
              source_name: customers.csv
              database_id: db_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              branch_id: br_3c1e9a7b5d2f4e8a9b0c6d4e2f1a3b5c
              schema: public
