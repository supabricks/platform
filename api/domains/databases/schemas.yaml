Database:
  type: object
  description: >-
    A PostgreSQL database and its branches. Its first branch carries the
    database's name and is its default branch. Compute size, storage used and
    history retention are not reported in version 1.
  required: [id, name, state, postgres_version, default_branch_id, branch_count, holds_project_default, connections, created_at, revision]
  properties:
    id: { $ref: '../../shared/schemas.yaml#/Id' }
    name: { $ref: './schemas.yaml#/DatabaseName' }
    state:
      type: string
      enum: [provisioning, running, suspending, suspended, resuming, deleting]
      description: >-
        The state of the database's first branch. `provisioning` until it has
        started for the first time; the `-ing` states last until the operation
        that caused them finishes.
    postgres_version: { type: string, description: 'The PostgreSQL major version.', examples: ['17'] }
    default_branch_id:
      allOf: [{ $ref: '../../shared/schemas.yaml#/Id' }]
      description: The database's first branch. It cannot be changed in version 1.
    branch_count: { type: integer, minimum: 1, description: 'Branches of this database that exist now, including the first.' }
    holds_project_default:
      type: boolean
      description: >-
        Whether the project's default branch is in this database. Such a
        database cannot be deleted on its own.
    connections:
      type: object
      description: Client connections to the first branch through the server.
      required: [open, limit]
      properties:
        open: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, description: 'The most one branch accepts at a time.' }
    created_at:
      allOf: [{ $ref: '../../shared/schemas.yaml#/Timestamp' }]
      description: >-
        When the database was created. For one that existed before the server
        recorded this, the time of the upgrade that started recording it.
    revision: { $ref: '../../shared/schemas.yaml#/Revision' }

DatabaseName:
  type: string
  description: >-
    Unique among the databases and branches of the project. Letters, digits
    and hyphens, at most 40 characters, stored in lower case.
  pattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]{0,38}[a-zA-Z0-9])?$'
  examples: [main]

ComputeSize:
  type: object
  required: [id, label, vcpu, memory_bytes, max_connections]
  properties:
    id: { type: string, examples: [xs, s, m, l, xl] }
    label: { type: string, examples: [Small] }
    vcpu: { type: number }
    memory_bytes: { $ref: '../../shared/schemas.yaml#/Bytes' }
    max_connections: { type: integer }

DatabaseCreate:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name: { $ref: './schemas.yaml#/DatabaseName' }

DatabaseUpdate:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name: { $ref: './schemas.yaml#/DatabaseName' }

DatabasePage:
  allOf:
    - $ref: '../../shared/schemas.yaml#/PageInfo'
    - type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: './schemas.yaml#/Database' } }

Connection:
  type: object
  description: >-
    Everything needed to connect, without the password. Clients build psql,
    JDBC, environment-file and driver snippets from these parts. When
    `available` is false only `branch_id` accompanies it.
  required: [available, branch_id]
  properties:
    available:
      type: boolean
      description: False on a governed server, where PostgreSQL is private and nobody connects directly.
    branch_id: { $ref: '../../shared/schemas.yaml#/Id' }
    host: { type: string }
    port: { type: integer }
    database: { type: string, description: 'The PostgreSQL database name to connect to, which is always `postgres`.' }
    role: { type: string, examples: [supabricks_owner] }
    sslmode: { type: string, enum: [disable, prefer, require, verify-full] }

Credentials:
  type: object
  required: [role, password, uri, expires_at]
  properties:
    role: { type: string }
    password: { type: string, format: password }
    uri: { type: string, description: 'A complete connection URI including the password.' }
    expires_at:
      description: Set when the credentials are short-lived. Null for a standing application role.
      oneOf: [{ $ref: '../../shared/schemas.yaml#/Timestamp' }, { type: 'null' }]
