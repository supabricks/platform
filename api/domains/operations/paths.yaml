# Operations: the durable record of every piece of asynchronous work.

operations:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
  get:
    operationId: listOperations
    tags: [Operations]
    summary: List operations in a project
    description: >-
      Newest first, across every feature. This is the project's activity feed.
      Today it holds project applies and database and branch changes; imports,
      sync runs, backups and job runs join it with their domains.
    x-backend: ready
    x-required-role: viewer
    x-console-features: [HM-03]
    x-issues: [285]
    parameters:
      - $ref: '../../shared/parameters.yaml#/Limit'
      - $ref: '../../shared/parameters.yaml#/Cursor'
      - name: kind
        in: query
        description: Only operations of this kind. A prefix ending in `.` matches a whole resource, for example `branch.`.
        schema: { type: string }
      - name: state
        in: query
        schema: { $ref: '../../shared/schemas.yaml#/OperationState' }
      - name: target
        in: query
        description: Only operations on this resource, as `<kind>:<id>`.
        schema: { type: string }
      - name: idempotency_key
        in: query
        description: Find the operation a key started, to recover after a lost response.
        schema: { type: string }
    responses:
      '200':
        description: A page of operations.
        content:
          application/json:
            schema: { $ref: './schemas.yaml#/OperationPage' }
            example:
              items: []
              next_cursor: null
      '400': { $ref: '../../shared/responses.yaml#/BadRequest' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }

operation:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Operation'
  get:
    operationId: getOperation
    tags: [Operations]
    summary: Get one operation
    description: Poll this until `state` is final. Responses carry `Retry-After` while the operation is running.
    x-backend: ready
    x-required-role: viewer
    x-console-features: [HM-03]
    responses:
      '200':
        description: The operation.
        headers:
          Retry-After: { schema: { type: integer }, description: 'Suggested seconds before the next poll. Absent once final.' }
        content:
          application/json:
            schema: { $ref: '../../shared/schemas.yaml#/Operation' }
            example:
              id: op_3c9e1f0a5b7d4e2c8a6f1d3b5c7e9a0b
              kind: project.apply
              state: running
              project_id: prj_5f0c2a9e7b1d4c3fa8e6d2b4c1a09f73
              target: { kind: project, id: prj_5f0c2a9e7b1d4c3fa8e6d2b4c1a09f73, label: sales-analytics }
              idempotency_key: 2b1c9d7e-create-sales
              created_at: '2026-10-10T14:05:00.000Z'
              started_at: '2026-10-10T14:05:00.000Z'
              finished_at: null
              steps:
                - { name: create database.main, state: running }
              cancellable: true
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }

operationCancel:
  parameters:
    - $ref: '../../shared/parameters.yaml#/Project'
    - $ref: '../../shared/parameters.yaml#/Operation'
  post:
    operationId: cancelOperation
    tags: [Operations]
    summary: Ask an operation to stop
    description: >-
      Accepted only while `cancellable` is true. Cancelling is a request: the
      operation reaches `cancelled` once it has stopped cleanly, or finishes
      anyway if it was too late.
    x-backend: ready
    x-required-role: editor
    x-console-features: [HM-03]
    responses:
      '202': { $ref: '../../shared/responses.yaml#/Accepted' }
      '401': { $ref: '../../shared/responses.yaml#/Unauthorized' }
      '403': { $ref: '../../shared/responses.yaml#/Forbidden' }
      '404': { $ref: '../../shared/responses.yaml#/NotFound' }
      '409': { $ref: '../../shared/responses.yaml#/Conflict' }
