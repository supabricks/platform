# Path, query and header parameters used by more than one domain.

Project:
  name: project
  in: path
  required: true
  description: Project ID.
  schema: { $ref: './schemas.yaml#/Id' }

Database:
  name: database
  in: path
  required: true
  description: Database ID.
  schema: { $ref: './schemas.yaml#/Id' }

Branch:
  name: branch
  in: path
  required: true
  description: Branch ID.
  schema: { $ref: './schemas.yaml#/Id' }

Operation:
  name: operation
  in: path
  required: true
  description: Operation ID.
  schema: { $ref: './schemas.yaml#/Id' }

Schema:
  name: schema
  in: path
  required: true
  description: A schema's name, percent-encoded.
  schema: { type: string, minLength: 1, maxLength: 63 }

Table:
  name: table
  in: path
  required: true
  description: A table's or view's name, percent-encoded.
  schema: { type: string, minLength: 1, maxLength: 63 }

Statement:
  name: statement
  in: path
  required: true
  description: Statement ID.
  schema: { $ref: './schemas.yaml#/Id' }

SavedQuery:
  name: query
  in: path
  required: true
  description: Saved query ID.
  schema: { $ref: './schemas.yaml#/Id' }

ImportSource:
  name: source
  in: path
  required: true
  description: Import source ID.
  schema: { $ref: './schemas.yaml#/Id' }

Import:
  name: import
  in: path
  required: true
  description: Import ID.
  schema: { $ref: './schemas.yaml#/Id' }

Role:
  name: role
  in: path
  required: true
  description: A role's name, percent-encoded.
  schema: { type: string, minLength: 1, maxLength: 63 }

Extension:
  name: extension
  in: path
  required: true
  description: An extension's name, percent-encoded.
  schema: { type: string, minLength: 1, maxLength: 63 }

Backup:
  name: backup
  in: path
  required: true
  description: Backup ID.
  schema: { $ref: './schemas.yaml#/Id' }

Limit:
  name: limit
  in: query
  description: Largest number of items to return.
  schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

Cursor:
  name: cursor
  in: query
  description: The `next_cursor` of the previous page.
  schema: { type: string }

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: >-
    A value the client makes up, unique per intended change. Repeating a request
    with the same key returns the original result instead of doing the work
    twice. Keys are remembered for at least 24 hours. Using a key again for a
    different request is refused with `409` and `code: idempotency_key_reused`.
  schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[!-~]+$', description: 'Printable ASCII without spaces.' }

IfMatch:
  name: If-Match
  in: header
  required: false
  description: >-
    The `ETag` from a previous read. When present, the change is refused with
    `412` if the resource has changed since.
  schema: { type: string }

IfMatchRequired:
  name: If-Match
  in: header
  required: true
  description: >-
    The `ETag` from a previous read. Required here because the change is hard
    to undo. Refused with `412` if the resource has changed since, and with
    `428` if the header is missing.
  schema: { type: string }

CsrfToken:
  name: X-CSRF-Token
  in: header
  required: false
  description: Required on every non-GET request authenticated by the browser session cookie.
  schema: { type: string }
