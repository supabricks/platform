# Schemas used by every domain.

Id:
  type: string
  description: >-
    Opaque, stable identifier assigned by the platform. The prefix names the kind
    (`prj_`, `src_`, `db_`, `br_`, `op_`). Treat the rest as opaque.
  pattern: '^[a-z]{2,5}_[A-Za-z0-9]{6,40}$'
  examples: [db_8f2a91c4]

Name:
  type: string
  description: Human-chosen name, unique within its parent. Can be changed without changing the ID.
  minLength: 1
  maxLength: 63

Timestamp:
  type: string
  format: date-time
  description: RFC 3339 instant in UTC.
  examples: ['2026-10-10T14:05:00Z']

Bytes:
  type: integer
  format: int64
  minimum: 0
  description: A size in bytes.

Revision:
  type: integer
  format: int64
  minimum: 0
  description: >-
    Increases by one each time the resource changes. Send it back in `If-Match`
    to make a change conditional on nobody else having changed the resource.

Lsn:
  type: string
  description: PostgreSQL log sequence number.
  pattern: '^[0-9A-F]{1,8}/[0-9A-F]{1,8}$'
  examples: ['0/4A2F0000']

PrincipalRef:
  type: object
  description: Who did something. In the local profile this is always the local owner.
  required: [id, kind, label]
  properties:
    id: { $ref: '#/Id' }
    kind: { type: string, enum: [local_owner, user, service] }
    label: { type: string }

ResourceRef:
  type: object
  description: A pointer to any resource, used by operations, activity and alerts.
  required: [kind, id]
  properties:
    kind:
      type: string
      enum: [project, database, branch, sync_pipeline, analytical_version, analytical_session, notebook, environment, job, job_run, publication, shared_dataset, import, backup, secret, service]
    id: { type: string }
    label: { type: string, description: 'Display name at the time of the response.' }

Problem:
  type: object
  description: Error body, following RFC 9457. `code` is stable and safe to branch on; `detail` is for people.
  required: [type, title, status, code]
  properties:
    type: { type: string, format: uri-reference, examples: ['https://supabricks.dev/problems/conflict'] }
    title: { type: string }
    status: { type: integer }
    code:
      type: string
      description: Stable machine-readable code.
      examples: [invalid_request, unauthorized, not_permitted, unavailable_in_profile, not_found, method_not_allowed, conflict, name_taken, revision_mismatch, precondition_required, capacity_exhausted, request_too_large, unsupported_media_type, idempotency_key_reused, delete_blocked, not_cancellable, operation_failed, request_timeout, unavailable, internal_error]
    detail: { type: string }
    instance: { type: string, description: 'The request ID, for support.' }
    errors:
      type: array
      description: Per-field problems for `invalid_request`.
      items:
        type: object
        required: [field, message]
        properties:
          field: { type: string, description: 'JSON pointer into the request body.' }
          message: { type: string }

Operation:
  type: object
  description: >-
    A piece of work the platform carries out after the request returns. Operations
    are durable: they survive a restart and can be found again by ID or by the
    idempotency key that started them.
  required: [id, kind, state, project_id, created_at]
  properties:
    id: { $ref: '#/Id' }
    kind:
      type: string
      description: What the operation does, as `<resource>.<verb>`.
      examples: [project.apply, project.delete, database.create, branch.create, branch.set_state, backup.create, database.restore, sync.run, import.load]
    state: { $ref: '#/OperationState' }
    project_id: { $ref: '#/Id' }
    target: { $ref: '#/ResourceRef' }
    actor: { $ref: '#/PrincipalRef' }
    idempotency_key: { type: string }
    created_at: { $ref: '#/Timestamp' }
    started_at: { oneOf: [{ $ref: '#/Timestamp' }, { type: 'null' }] }
    finished_at:
      oneOf: [{ $ref: '#/Timestamp' }, { type: 'null' }]
      description: Null until the operation reaches a final state.
    steps:
      type: array
      description: The steps of the operation in order, so a client can show progress.
      items:
        type: object
        required: [name, state]
        properties:
          name: { type: string }
          state: { type: string, enum: [pending, running, succeeded, failed, skipped] }
          progress: { type: number, minimum: 0, maximum: 1, description: 'Fraction complete, when the step can measure it.' }
          detail: { type: string }
    result:
      type: object
      description: Set when the operation succeeds. Its shape depends on `kind` and always includes the resource that was created or changed.
      additionalProperties: true
    error: { $ref: '#/Problem' }
    cancellable: { type: boolean }

OperationState:
  type: string
  enum: [pending, running, succeeded, failed, cancelled, superseded]
  description: >-
    `superseded` means a later operation on the same resource made this one
    unnecessary before it ran.

PageInfo:
  type: object
  required: [next_cursor]
  properties:
    next_cursor:
      oneOf: [{ type: string }, { type: 'null' }]
      description: Pass as `cursor` to get the next page. Null on the last page.
    total_estimate:
      type: integer
      description: Present only where the platform can estimate the total cheaply.

BackendStatus:
  type: string
  description: >-
    Not part of the wire contract. Records, for each operation in this document,
    whether the platform can do it today.
  enum: [ready, cli-only, new]

IdleTimeout:
  description: Seconds with no gateway clients or protected work before suspension. Null means never (the default). Capture retains its source until the generation is deleted, even when paused.
  oneOf:
    - { type: integer, minimum: 60, maximum: 86400 }
    - { type: 'null' }
  default: null

ComputeUpdate:
  type: object
  additionalProperties: false
  anyOf: [{ required: [compute_size] }, { required: [idle_timeout_seconds] }]
  properties:
    compute_size: { type: string, enum: [s, m, l] }
    idle_timeout_seconds: { $ref: './schemas.yaml#/IdleTimeout' }
    allow_restart: { type: boolean, default: false, description: 'Required to resize running compute. Drain connections and work first.' }

ComputeSettings:
  type: object
  required: [size, idle_timeout_seconds, last_suspend_reason, last_suspended_at_ms, capture_holds_awake, resource_model]
  properties:
    size: { type: string, enum: [s, m, l], description: 'Desired size; applied when the lifecycle operation succeeds.' }
    idle_timeout_seconds: { $ref: './schemas.yaml#/IdleTimeout' }
    last_suspend_reason: { enum: [manual, idle_timeout, null] }
    last_suspended_at_ms: { type: [integer, 'null'], description: 'Unix milliseconds when suspension was requested, not when retirement completed.' }
    capture_holds_awake: { type: boolean }
    resource_model: { const: shared_host_tuning }

StorageUsage:
  type: object
  description: >-
    Pageserver observations sampled every 30 seconds without waking compute.
    Stale after 120 seconds or an owner restart. Unknown bytes are null, never
    zero. Logical size includes inherited data and may be estimated until
    logical_size_accurate is true. Exclusive bytes count this timeline's layer
    files, excluding ancestor layers, and count local/remote copies only once;
    they are not a bytewise row-data delta. Excludes WAL, compute caches,
    exports, backup-only timelines, analytical objects and object-store overhead.
  required: [status, sampled_at_ms, logical_bytes, exclusive_physical_bytes, logical_size_accurate]
  properties:
    status: { enum: [fresh, stale, unavailable] }
    sampled_at_ms: { type: [integer, 'null'] }
    logical_bytes: { type: [integer, 'null'], minimum: 0 }
    exclusive_physical_bytes: { type: [integer, 'null'], minimum: 0 }
    logical_size_accurate: { type: boolean }
    database:
      type: object
      description: Sum of distinct live database timeline layers; never the sum of logical clone sizes. Null if any branch is unavailable. Timestamp is the oldest component sample.
      required: [status, sampled_at_ms, total_physical_bytes, scope, branch_count]
      properties:
        status: { enum: [fresh, stale, unavailable] }
        sampled_at_ms: { type: [integer, 'null'] }
        total_physical_bytes: { type: [integer, 'null'], minimum: 0 }
        scope: { const: live_database_timeline_layers }
        branch_count: { type: integer, minimum: 0 }
