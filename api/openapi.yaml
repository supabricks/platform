openapi: 3.1.0
info:
  title: Supabricks Platform API
  version: 1.0.0-draft.1
  summary: One API for the console, the command line, agents and automation.
  description: |
    The contract the platform provides to every surface: the browser console,
    the `supabricks` command line, MCP agents and customer automation.

    This document is a **design target**, not a description of what ships
    today. It was derived from the console prototype: each operation names the
    prototype features it serves (`x-console-features`) and says whether the
    platform can already do it (`x-backend`):

    - `ready`: the platform does this today, through its current action API.
    - `cli-only`: the platform does this today, but only from the command line
      or a server-side admin request file.
    - `new`: there is no platform support yet. `x-issues` lists the tracking
      issues on `supabricks/platform`.

    ## Conventions

    - **Resources and IDs.** Paths address resources by opaque ID, never by
      name. Names can change; IDs do not.
    - **Long-running work.** Anything that takes more than a moment returns
      `202` with an `Operation`. Follow it at
      `/projects/{project}/operations/{operation}`.
    - **Idempotency.** Every request that creates something or starts work
      takes an `Idempotency-Key` header. Repeating the request returns the
      original result.
    - **Concurrency.** Reads return an `ETag`. Send it back in `If-Match` to
      make a change conditional. Changes that are hard to undo require it.
    - **Paging.** Lists take `limit` and `cursor` and return `items` and
      `next_cursor`.
    - **Errors.** `application/problem+json` (RFC 9457) with a stable `code`.
    - **Time and size.** Instants are RFC 3339 in UTC. Sizes are bytes.
      Durations name their unit in the field (`_seconds`, `_ms`).
    - **Profiles.** The same API serves a single-user local install and a
      governed server. An operation a profile does not offer returns `403`
      with `code: unavailable_in_profile`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: '{origin}/api/v1'
    variables:
      origin:
        default: https://analytics.internal.example:8443
        description: The console address of the installation.
security:
  - session: []
  - token: []
tags:
  - { name: Projects, description: 'The container for everything else.' }
  - { name: Operations, description: 'The durable record of asynchronous work, and the project activity feed.' }
  - { name: Databases, description: 'PostgreSQL databases: lifecycle and how to connect.' }
  - { name: Branches, description: "Copy-on-write branches of a database. A database's first branch has no parent; the rest form a tree beneath it. A project has one default branch." }
  - { name: SQL, description: 'Statements run on a branch through the server, within fixed limits, and the queries a project keeps.' }
  - { name: Tables, description: 'What a branch holds that is read like a table, how each is built, and its rows a page at a time.' }
  - { name: Imports, description: 'Files uploaded to the server, inspected, and loaded into new tables.' }
  - { name: Server, description: 'The installation itself: version, health and fixed limits.' }
x-tagGroups:
  - name: Project
    tags: [Projects, Operations]
  - name: PostgreSQL
    tags: [Databases, Branches, SQL, Tables, Imports]
  - name: Installation
    tags: [Server]
paths:
  # ---- Projects ----
  /projects: { $ref: './domains/projects/paths.yaml#/projects' }
  /projects/{project}: { $ref: './domains/projects/paths.yaml#/project' }
  /projects/{project}/deletion-impact: { $ref: './domains/projects/paths.yaml#/projectDeletionImpact' }
  /projects/{project}/map: { $ref: './domains/projects/paths.yaml#/projectMap' }
  /projects/{project}/recents: { $ref: './domains/projects/paths.yaml#/projectRecents' }
  # ---- Operations ----
  /projects/{project}/operations: { $ref: './domains/operations/paths.yaml#/operations' }
  /projects/{project}/operations/{operation}: { $ref: './domains/operations/paths.yaml#/operation' }
  /projects/{project}/operations/{operation}/cancel: { $ref: './domains/operations/paths.yaml#/operationCancel' }
  # ---- Databases ----
  /compute-sizes: { $ref: './domains/databases/paths.yaml#/computeSizes' }
  /projects/{project}/databases: { $ref: './domains/databases/paths.yaml#/databases' }
  /projects/{project}/databases/{database}: { $ref: './domains/databases/paths.yaml#/database' }
  /projects/{project}/databases/{database}/suspend: { $ref: './domains/databases/paths.yaml#/databaseSuspend' }
  /projects/{project}/databases/{database}/resume: { $ref: './domains/databases/paths.yaml#/databaseResume' }
  /projects/{project}/databases/{database}/connection: { $ref: './domains/databases/paths.yaml#/databaseConnection' }
  /projects/{project}/databases/{database}/credentials: { $ref: './domains/databases/paths.yaml#/databaseCredentials' }
  # ---- Branches ----
  /projects/{project}/databases/{database}/branches: { $ref: './domains/branches/paths.yaml#/branches' }
  /projects/{project}/databases/{database}/branches/{branch}: { $ref: './domains/branches/paths.yaml#/branch' }
  /projects/{project}/databases/{database}/branches/{branch}/suspend: { $ref: './domains/branches/paths.yaml#/branchSuspend' }
  /projects/{project}/databases/{database}/branches/{branch}/resume: { $ref: './domains/branches/paths.yaml#/branchResume' }
  /projects/{project}/databases/{database}/branches/{branch}/default: { $ref: './domains/branches/paths.yaml#/branchDefault' }
  /projects/{project}/databases/{database}/branches/{branch}/reset: { $ref: './domains/branches/paths.yaml#/branchReset' }
  /projects/{project}/databases/{database}/branches/{branch}/restore-window: { $ref: './domains/branches/paths.yaml#/branchRestoreWindow' }
  /projects/{project}/databases/{database}/branches/{branch}/schema-diff: { $ref: './domains/branches/paths.yaml#/branchSchemaDiff' }

  # ---- SQL ----
  /projects/{project}/statements: { $ref: './domains/sql/paths.yaml#/statements' }
  /projects/{project}/statements/{statement}: { $ref: './domains/sql/paths.yaml#/statement' }
  /projects/{project}/statements/{statement}/cancel: { $ref: './domains/sql/paths.yaml#/statementCancel' }
  /projects/{project}/saved-queries: { $ref: './domains/sql/paths.yaml#/savedQueries' }
  /projects/{project}/saved-queries/{query}: { $ref: './domains/sql/paths.yaml#/savedQuery' }

  # ---- Tables ----
  /projects/{project}/databases/{database}/branches/{branch}/tables: { $ref: './domains/tables/paths.yaml#/tables' }
  /projects/{project}/databases/{database}/branches/{branch}/tables/{schema}/{table}: { $ref: './domains/tables/paths.yaml#/table' }
  /projects/{project}/databases/{database}/branches/{branch}/tables/{schema}/{table}/rows: { $ref: './domains/tables/paths.yaml#/tableRows' }

  # ---- Imports ----
  /projects/{project}/import-sources: { $ref: './domains/imports/paths.yaml#/importSources' }
  /projects/{project}/import-sources/{source}: { $ref: './domains/imports/paths.yaml#/importSource' }
  /projects/{project}/import-sources/{source}/content: { $ref: './domains/imports/paths.yaml#/importSourceContent' }
  /projects/{project}/import-sources/{source}/inspect: { $ref: './domains/imports/paths.yaml#/importSourceInspect' }
  /projects/{project}/imports: { $ref: './domains/imports/paths.yaml#/imports' }
  /projects/{project}/imports/{import}: { $ref: './domains/imports/paths.yaml#/import' }
  /projects/{project}/imports/{import}/cancel: { $ref: './domains/imports/paths.yaml#/importCancel' }
  /projects/{project}/imports/{import}/retry: { $ref: './domains/imports/paths.yaml#/importRetry' }

  # ---- Server ----
  /server/version: { $ref: './domains/server/paths.yaml#/serverVersion' }
  /server/services: { $ref: './domains/server/paths.yaml#/serverServices' }
  /server/services/{service}/restart: { $ref: './domains/server/paths.yaml#/serverServiceRestart' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sb_session
      description: >-
        Browser session set at sign-in. Non-GET requests must also carry the
        `X-CSRF-Token` header and the server's own `Origin`. In the local
        profile the session is created when the console is launched, and the
        cookie is named `sb_<console instance>` so that two consoles on one
        machine do not share it.
    token:
      type: http
      scheme: bearer
      description: >-
        A service account token. A governed server accepts this and checks the
        caller's role in the project for every operation. Browser sessions on
        a governed server use the console's own endpoints until the console
        moves to this API.
