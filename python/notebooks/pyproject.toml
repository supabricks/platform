[project]
name = "supabricks-notebook-runtime"
version = "0.1.0"
requires-python = "==3.12.13"
# Retain the complete N01-qualified environment; upgrades require qualification.
dependencies = [
    "jupyter-server==2.21.0",
    "ipykernel==7.3.0",
    # pyspark-client ships an sdist; lock its build tools for the native assembler.
    "setuptools==80.9.0",
    "wheel==0.45.1",
    "packaging==25.0",
    "arro3-core==0.8.2",
    "deltalake==1.6.3",
    "deprecated==1.3.1",
    "googleapis-common-protos==1.75.3",
    "grpcio==1.83.1",
    "grpcio-status==1.83.1",
    "numpy==2.5.2",
    "pandas==2.3.3",
    "protobuf==7.36.1",
    "psutil==7.2.2",
    "psycopg[binary]==3.3.5",
    "pyarrow==25.0.1",
    "pysail==0.7.1",
    "pyspark-client==4.2.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "pyyaml==6.0.3",
    "six==1.17.0",
    "typing-extensions==4.16.0",
    "tzdata==2026.3",
    "wrapt==2.4.0",
    "zstandard==0.25.0",
]

[tool.uv]
package = false
no-build-isolation-package = ["pyspark-client"]
no-build-package = [
    "arro3-core", "deltalake", "grpcio", "numpy", "pandas", "psutil",
    "psycopg-binary", "pyarrow", "pysail", "pyyaml", "wrapt", "zstandard",
]
required-version = "==0.11.21"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
