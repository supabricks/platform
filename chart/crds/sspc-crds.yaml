apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.sspc.io
spec:
  group: sspc.io
  names:
    kind: Database
    plural: databases
    shortNames:
    - db
    singular: database
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodePort
      name: Port
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for DatabaseSpec via `CustomResource`
        properties:
          spec:
            properties:
              cuLimit:
                default: 10
                description: |-
                  Compute ceiling in CU (1 CU = 0.1 core). Limits may oversubscribe the
                  pool; suspended databases hold zero CU.
                format: int64
                type: integer
              priority:
                default: Standard
                description: |-
                  Compute priority (RFC 011 QoS classes, compute layer): under contention,
                  CPU divides by CFS weight (higher priority = larger request fraction), and
                  preemption/eviction takes Low first — which here is just a rude suspend.
                enum:
                - High
                - Standard
                - Low
                type: string
              suspendAfterSeconds:
                default: 300
                description: Idle seconds before suspend (enforced by the operator's idle loop, P3).
                format: int64
                type: integer
              ttlSeconds:
                description: Optional TTL; the reaper deletes the resource after this many seconds.
                format: int64
                nullable: true
                type: integer
            type: object
          status:
            nullable: true
            properties:
              flushLsn:
                nullable: true
                type: string
              lastActivity:
                nullable: true
                type: string
              message:
                nullable: true
                type: string
              nodePort:
                format: int32
                nullable: true
                type: integer
              phase:
                enum:
                - Provisioning
                - Active
                - Suspended
                - Expired
                - Failed
                - null
                nullable: true
                type: string
              suspendedAt:
                nullable: true
                type: string
              tenantId:
                nullable: true
                type: string
              timelineId:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Database
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: branches.sspc.io
spec:
  group: sspc.io
  names:
    kind: Branch
    plural: branches
    shortNames:
    - br
    singular: branch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.database
      name: Database
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodePort
      name: Port
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for BranchSpec via `CustomResource`
        properties:
          spec:
            properties:
              cuLimit:
                default: 10
                description: |-
                  Compute ceiling in CU (1 CU = 0.1 core). Limits may oversubscribe the
                  pool; suspended databases hold zero CU.
                format: int64
                type: integer
              database:
                description: Name of the parent Database (same namespace).
                type: string
              priority:
                default: Standard
                description: |-
                  Compute priority (RFC 011 QoS classes, compute layer): under contention,
                  CPU divides by CFS weight (higher priority = larger request fraction), and
                  preemption/eviction takes Low first — which here is just a rude suspend.
                enum:
                - High
                - Standard
                - Low
                type: string
              suspendAfterSeconds:
                default: 300
                description: Idle seconds before suspend (branches sleep aggressively by default).
                format: int64
                type: integer
              ttlSeconds:
                description: 'Branch point: head-of-parent only in M1 (`at` reserved, RFC 012).'
                format: int64
                nullable: true
                type: integer
            required:
            - database
            type: object
          status:
            nullable: true
            properties:
              flushLsn:
                nullable: true
                type: string
              lastActivity:
                nullable: true
                type: string
              message:
                nullable: true
                type: string
              nodePort:
                format: int32
                nullable: true
                type: integer
              phase:
                enum:
                - Provisioning
                - Active
                - Suspended
                - Expired
                - Failed
                - null
                nullable: true
                type: string
              suspendedAt:
                nullable: true
                type: string
              tenantId:
                nullable: true
                type: string
              timelineId:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Branch
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: enrolleddatabases.sspc.io
spec:
  group: sspc.io
  names:
    kind: EnrolledDatabase
    plural: enrolleddatabases
    shortNames:
    - edb
    singular: enrolleddatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.serverVersion
      name: Version
      type: string
    - jsonPath: .status.databaseCount
      name: DBs
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for EnrolledDatabaseSpec via `CustomResource`
        properties:
          spec:
            description: |-
              An existing Postgres — anywhere — under governance without migration
              (RFC 010: enrolled class; M1-lite: reachability + inventory health).
            properties:
              connectionUri:
                description: |-
                  Postgres connection URI. RFC 010's friction budget: a read-only
                  monitoring role is all it needs (`GRANT pg_monitor`).
                type: string
            required:
            - connectionUri
            type: object
          status:
            nullable: true
            properties:
              databaseCount:
                format: int64
                nullable: true
                type: integer
              lastChecked:
                nullable: true
                type: string
              message:
                nullable: true
                type: string
              phase:
                enum:
                - Reachable
                - Unreachable
                - null
                nullable: true
                type: string
              serverVersion:
                nullable: true
                type: string
              totalSize:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: EnrolledDatabase
        type: object
    served: true
    storage: true
    subresources:
      status: {}
