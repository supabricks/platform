# M1 defaults target kind with locally-loaded images.
#
# Image provenance: the DIGEST is the source of truth.
# `name` is what pods reference (kind-loaded local tag, pullPolicy Never);
# `digest` is the pinned upstream identity. The installer derives its pull
# list from THIS file (no second source of truth), every pod exposes its
# expected digest as the annotation sspc.io/image-digest, and
# chart/check-hardening.sh fails if a workload lacks one. Keep name+digest
# on one line per image — the installer parses them pairwise.
images:
  neon: {name: "ghcr.io/neondatabase/neon:latest", digest: "ghcr.io/neondatabase/neon@sha256:7a4f124917bb929964b2d696d710f19584f80bb9bd51b2af4a6e2425434c761f"}
  compute: {name: "ghcr.io/neondatabase/compute-node-v16:latest", digest: "ghcr.io/neondatabase/compute-node-v16@sha256:b3e151661bd2ee11eb2843c8926001966cb23969227e9673c5f42fc3fbe14249"}
  operator: {name: "sspc-operator:p1", digest: "local-build"}
  postgres: {name: "postgres:16-alpine", digest: "postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777"}
  busybox: {name: "busybox:1.36", digest: "busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"}
  minio: {name: "quay.io/minio/minio:RELEASE.2022-10-20T00-55-09Z", digest: "quay.io/minio/minio@sha256:df7363871efee5192fb5510ee80e10bb8c5cdc45c9301a825302b1d52c60ba64"}
  mc: {name: "minio/mc:latest", digest: "minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727"}
imagePullPolicy: Never

# Demo-only object store (001: the product integrates the customer's S3).
demoMinio:
  enabled: true

safekeeper:
  replicas: 1

# S3 endpoint + bucket. Credentials live in a SECRET:
# the demo defaults below render into Secret sspc-s3; real deployments set
# existingSecret to a Secret carrying AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# and the literal values here are ignored (never put real keys in values).
s3:
  endpoint: http://minio:9000
  bucket: neon
  region: eu-north-1
  accessKey: minio      # demo-scoped; ignored when existingSecret is set
  secretKey: password   # demo-scoped; ignored when existingSecret is set
  existingSecret: ""

# The storage controller's own Postgres. Same contract: demo default renders
# into Secret sspc-controller-pg; set existingSecret for real deployments.
controllerPg:
  password: postgres    # demo-scoped; ignored when existingSecret is set
  existingSecret: ""

# In-cluster network boundary: default-deny ingress plus
# explicit edges. NOTE: kind's default CNI (kindnet) does NOT enforce
# NetworkPolicy — on kind these are a rendered contract and a conformance
# check; enforcement needs a policy-capable CNI (documented in hardening.md).
networkPolicies:
  enabled: true

# Security baseline: every workload runs with
# seccompProfile RuntimeDefault, allowPrivilegeEscalation false, and all
# capabilities dropped. Our images (operator, notify-sink) additionally run
# nonroot with read-only root. Per-workload exceptions (user IDs, writable
# roots for data dirs) are named and justified in chart/hardening.md — a
# new workload without an explicit posture fails chart/check-hardening.sh.

# Cell (storage layer) resource guarantees. Requests only — the cell serves
# every tenant so it may burst, but it must never run BestEffort (evicted
# before the computes it backs). Laptop-sized defaults; raise on real metal.
cellResources:
  pageserver: {cpu: 250m, memory: 512Mi}
  safekeeper: {cpu: 100m, memory: 256Mi}
  broker: {cpu: 20m, memory: 32Mi}
  storageController: {cpu: 50m, memory: 64Mi}
  controllerPg: {cpu: 50m, memory: 128Mi}
  minio: {cpu: 50m, memory: 128Mi}
  notifySink: {cpu: 5m, memory: 16Mi}
  operator: {cpu: 50m, memory: 64Mi}

# NodePorts (must match the kind extraPortMappings block)
nodePorts:
  storageController: 30099
  pageserverApi: 30098
  mcp: 30080
