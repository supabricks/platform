# M1 defaults target kind with locally-loaded images.
images:
  neon: ghcr.io/neondatabase/neon:latest
  compute: ghcr.io/neondatabase/compute-node-v16:latest
  operator: sspc-operator:p1
  postgres: postgres:16-alpine
  busybox: busybox:1.36
  minio: quay.io/minio/minio:RELEASE.2022-10-20T00-55-09Z
  mc: minio/mc:latest
imagePullPolicy: Never

# Demo-only object store (001: the product integrates the customer's S3).
demoMinio:
  enabled: true

safekeeper:
  replicas: 1

# S3 credentials + bucket (point at the customer's store when demoMinio is off)
s3:
  endpoint: http://minio:9000
  bucket: neon
  region: eu-north-1
  accessKey: minio
  secretKey: password

# Security baseline (review 001 P1-5): our own images (operator, notify-sink)
# run fully hardened — nonroot, no privilege escalation, all capabilities
# dropped, read-only root. The STOCK images (Neon pageserver/safekeeper/
# broker/controller, postgres, minio) run as shipped: they manage their own
# users and data dirs, and constraining them is upstream's contract, not
# ours. Documented exception, revisit at M2 hardening.

# Cell (storage layer) resource guarantees. Requests only — the cell serves
# every tenant so it may burst, but it must never run BestEffort (evicted
# before the computes it backs). Laptop-sized defaults; raise on real metal.
cellResources:
  pageserver: {cpu: 250m, memory: 512Mi}
  safekeeper: {cpu: 100m, memory: 256Mi}
  broker: {cpu: 20m, memory: 32Mi}
  storageController: {cpu: 50m, memory: 64Mi}
  controllerPg: {cpu: 50m, memory: 128Mi}
  minio: {cpu: 50m, memory: 128Mi}
  notifySink: {cpu: 5m, memory: 16Mi}
  operator: {cpu: 50m, memory: 64Mi}

# NodePorts (must match the kind extraPortMappings block)
nodePorts:
  storageController: 30099
  pageserverApi: 30098
  mcp: 30080
