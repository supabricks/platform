apiVersion: v1
kind: ServiceAccount
metadata:
  name: sspc-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sspc-operator
rules:
- apiGroups: [""]
  resources: [pods, services, configmaps, secrets]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [""]
  resources: [events]
  # get/list: the get_events tool reads the audit line back (013 ticker).
  verbs: [get, list, watch, create, patch]
- apiGroups: [sspc.io]
  resources: [databases, branches, enrolleddatabases]
  # create/delete: the in-operator MCP server creates and deletes CRs itself.
  verbs: [get, list, watch, create, patch, update, delete]
- apiGroups: [sspc.io]
  resources: [databases/status, branches/status, enrolleddatabases/status]
  verbs: [get, patch, update]
- apiGroups: [sspc.io]
  resources: [databases/finalizers, branches/finalizers]
  verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sspc-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sspc-operator
subjects:
- kind: ServiceAccount
  name: sspc-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sspc-operator
spec:
  replicas: 1
  selector: {matchLabels: {app: sspc-operator}}
  template:
    metadata: {labels: {app: sspc-operator}}
    spec:
      serviceAccountName: sspc-operator
      containers:
      - name: operator
        image: {{ .Values.images.operator }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: SSPC_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - {name: SSPC_STORCON_URL, value: "http://storage-controller:1234"}
        - {name: SSPC_COMPUTE_IMAGE, value: {{ .Values.images.compute | quote }}}
        - {name: SSPC_IMAGE_PULL_POLICY, value: {{ .Values.imagePullPolicy | quote }}}
        - {name: RUST_LOG, value: "info,kube=warn"}
        ports:
        - {containerPort: 8080, name: mcp}
---
apiVersion: v1
kind: Service
metadata:
  name: sspc-mcp
spec:
  type: NodePort
  selector: {app: sspc-operator}
  ports:
  - {name: mcp, port: 8080, nodePort: {{ .Values.nodePorts.mcp }}}
