# The storage controller's own Postgres (system-catalog seed, 001 §4.1/O2).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: controller-pg
spec:
  serviceName: controller-pg
  replicas: 1
  selector: {matchLabels: {app: controller-pg}}
  template:
    metadata:
      labels: {app: controller-pg}
      annotations:
        sspc.io/image-digest: {{ .Values.images.postgres.digest | quote }}
    spec:
      priorityClassName: sspc-cell
      automountServiceAccountToken: false
      # Runs as the image's postgres user directly (alpine uid 70) so the
      # root->su-exec path (which needs SETUID/SETGID) is never used and all
      # capabilities can be dropped. fsGroup keeps the PVC writable.
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
      - name: postgres
        image: {{ .Values.images.postgres.name }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: {{ .Values.cellResources.controllerPg.cpu }}, memory: {{ .Values.cellResources.controllerPg.memory }}}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.controllerPg.existingSecret | default "sspc-controller-pg" | quote }}
              key: password
        - {name: POSTGRES_DB, value: storage_controller}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports:
        - {containerPort: 5432}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        readinessProbe:
          exec: {command: [pg_isready, -U, postgres]}
          periodSeconds: 2
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: controller-pg
spec:
  selector: {app: controller-pg}
  ports:
  - {name: pg, port: 5432}
