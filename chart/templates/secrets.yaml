# Credential Secrets: workloads reference these via
# secretKeyRef — no credential ever renders as a literal pod env value.
# Demo defaults only; real deployments set s3.existingSecret /
# controllerPg.existingSecret and these are not rendered.
{{- if not .Values.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: sspc-s3
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretKey | quote }}
{{- end }}
---
{{- if not .Values.controllerPg.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: sspc-controller-pg
stringData:
  password: {{ .Values.controllerPg.password | quote }}
{{- end }}
