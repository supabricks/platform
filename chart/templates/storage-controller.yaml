# Storage controller, dev mode. control_plane_url MUST be set or the
# controller panics on the first compute notification (spike/NOTES.md Day 3);
# the notify-sink absorbs them until the operator grows its receiver (P2/P3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-controller
spec:
  replicas: 1
  selector: {matchLabels: {app: storage-controller}}
  template:
    metadata:
      labels: {app: storage-controller}
      annotations:
        sspc.io/image-digest: {{ .Values.images.neon.digest | quote }}
    spec:
      priorityClassName: sspc-cell
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: wait-for-pg
        image: {{ .Values.images.postgres.name }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        command: ["/bin/sh", "-c"]
        args: ["until pg_isready -h controller-pg -U postgres; do sleep 1; done"]
      containers:
      - name: controller
        image: {{ .Values.images.neon.name }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.controllerPg.existingSecret | default "sspc-controller-pg" | quote }}
              key: password
        command:
        - storage_controller
        - --listen=0.0.0.0:1234
        - --database-url=postgresql://postgres:$(DATABASE_PASSWORD)@controller-pg:5432/storage_controller
        - --control-plane-url=http://notify-sink:3081
        - --dev
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: {{ .Values.cellResources.storageController.cpu }}, memory: {{ .Values.cellResources.storageController.memory }}}
        ports:
        - {containerPort: 1234}
        readinessProbe:
          httpGet: {path: /status, port: 1234}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: storage-controller
spec:
  type: NodePort
  selector: {app: storage-controller}
  ports:
  - {name: http, port: 1234, nodePort: {{ .Values.nodePorts.storageController }}}
