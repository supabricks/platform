apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
spec:
  replicas: 1
  selector: {matchLabels: {app: broker}}
  template:
    metadata: {labels: {app: broker}}
    spec:
      priorityClassName: sspc-cell
      containers:
      - name: broker
        image: {{ .Values.images.neon }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["storage_broker", "--listen-addr=0.0.0.0:50051"]
        resources:
          requests: {cpu: {{ .Values.cellResources.broker.cpu }}, memory: {{ .Values.cellResources.broker.memory }}}
        ports:
        - {containerPort: 50051}
---
apiVersion: v1
kind: Service
metadata:
  name: broker
spec:
  selector: {app: broker}
  ports:
  - {name: grpc, port: 50051}
